        p.gaps.length > 4 ? ` Showing 4 of ${n(p.gaps.length)}.` : ""}</p>
      <pre class="quote">${esc(measured)}</pre>
    </div>
    ${ack}
    ${footnote()}`;
}

/* ══════════════════════════════════════════════════════════════════════
   Screen: Your memories
   ══════════════════════════════════════════════════════════════════════ */
function defaultSlug(snap) {
  // An unknown ?slug is ignored rather than sent: the request would 404 and the
  // screen would blame the store instead of the link.
  if (CFG.slug && (snap.stores || []).some((s) => s.slug === CFG.slug)) return CFG.slug;
  const stores = (snap.stores || []).filter((s) => s.status === "ok" && s.records > 0);
  if (!stores.length) return (snap.stores && snap.stores[0] && snap.stores[0].slug) || "global";
  return stores.slice().sort((a, b) => b.records - a.records)[0].slug;
}

function storeSelect(snap, selected, id) {
  const stores = (snap.stores || []).slice().sort((a, b) => b.records - a.records);
  return `<select id="${id}" aria-label="Project">` + stores.map((s) =>
    `<option value="${esc(s.slug)}"${s.slug === selected ? " selected" : ""}${s.status === "error" ? " disabled" : ""}>` +
    `${esc(s.label)} — ${s.status === "error" ? "could not be read" : n(s.records)}</option>`).join("") + `</select>`;
}

/**
 * The behavioural overlay, in the user's words. `usage` is null when a memory has
 * never appeared in the recall log in-window — no dot at all, because "never a
 * candidate" is a different fact from "used" or "always dropped" and inventing a
 * dot for it would be the fabrication this screen exists to avoid.
 */
const USAGE_LABEL = {
  hot:  (u) => `reaches the assistant often — ${n(u.recalls)}×`,
  warm: (u) => `reaches it sometimes — ${n(u.recalls)}×`,
  dead: (u) => `a candidate, but dropped for space — ${n(u.drops)}×, never sent`,
};
function usageTag(r) {
  const u = r.usage;
  if (!u || !USAGE_LABEL[u.bucket]) return "";
  const rel = u.related && u.related.length
    ? ` · recalled alongside ${n(u.related.length)}`
    : "";
  return `<span class="tag strong" data-t="${u.bucket}"><span class="mk"></span>${esc(USAGE_LABEL[u.bucket](u))}${rel}</span>`;
}

function rowTags(r, page) {
  const out = [];
  const ut = usageTag(r);
  if (ut) out.push(ut);
  if (page.vectorStatus !== "ok" || r.hasVector === null) {
    out.push(`<span class="tag" data-t="unchecked">${statusMark("unmeasured")}not checked for meaning-search</span>`);
  } else if (r.hasVector) {
    out.push(`<span class="tag strong" data-t="meaning"><span class="mk"></span>findable by meaning</span>`);
  } else {
    out.push(`<span class="tag strong" data-t="words"><span class="mk"></span>exact words only</span>`);
  }
  if (r.lowSignal && r.lowSignal.length) {
    out.push(`<span class="tag" data-t="clutter"><span class="mk"></span>clutter — ${esc(VOCAB.lowSignal[r.lowSignal[0]] || r.lowSignal[0])}</span>`);
  }
  if (r.duplicateGroup >= 0) out.push(`<span class="tag"><span class="mk"></span>saved more than once</span>`);
  return out.join("");
}

function screenMemories() {
  if (state.loading) return screenHealthLoading();
  if (state.fatal) return screenFatal(state.fatal);
  const snap = state.snapshot;
  const t = snap.totals;
  const slug = state.memSlug || defaultSlug(snap);
  const store = (snap.stores || []).find((s) => s.slug === slug);
  const storeName = store ? store.label : slug;

  const head = `<h1 class="page-title">${n(t.records)} memories across ${n(t.stores)} ${plural(t.stores, "project")}</h1>
    <p class="lede">Everything your assistant has saved. Search it the way you would ask a question.
      This reads one project at a time — the same way the assistant does when you are working inside that project.</p>
    <form class="search" id="memform">
      <input type="search" id="memq" value="${esc(state.memQ)}" placeholder="a word or phrase you remember saying" aria-label="Search your memories">
      ${storeSelect(snap, slug, "memslug")}
      <button class="btn primary" type="submit">${state.recordsLoading ? "Searching…" : "Search"}</button>
    </form>`;

  if (state.recordsError) return head + errorBlock(state.recordsError, `The memories in ${storeName}`);

  if (state.recordsLoading || !state.records) {
    const skRow = `<div class="row"><div>
        <span class="sk line" style="width:78%"></span>
        <span class="sk line" style="width:52%;margin-top:7px"></span>
        <span class="sk line" style="width:230px;margin-top:9px;height:14px"></span>
      </div><div class="side"><span class="sk line" style="width:150px;height:24px"></span>
      <span class="sk line" style="width:120px;height:24px"></span></div></div>`;
    return head + `<div class="filters"><span>Reading ${store ? n(store.records) + " memories in " + esc(storeName) : "the store"}…</span></div>
      <div class="rows">${skRow + skRow + skRow + skRow}</div>
      <p class="footnote"><span>The rows keep their height while they fill, so nothing jumps under your cursor.</span></p>`;
  }

  const page = state.records;
  const clutterCount = page.rows.filter((r) => r.lowSignal && r.lowSignal.length).length;
  const rows = page.rows.filter((r) => !state.hideClutter || !(r.lowSignal && r.lowSignal.length));

  if (!page.total) {
    const vecEmpty = store && store.vectorState === "empty";
    const vecUnmeasured = page.vectorStatus !== "ok";
    return head + (state.memQ
      ? `<div class="empty" style="margin-top:28px">
          <h2>No memory matches “${esc(state.memQ)}” in ${esc(storeName)}.</h2>
          <p>That may be the honest answer — or it may be this project's fault.
          ${vecEmpty
            ? `<b>${esc(storeName)} can only match your exact words right now</b>, so a memory saved in different words is invisible to this search and to the assistant.`
            : "This search matches exact words only, so try the words you would have used at the time."}</p>
          <div class="acts">
            <code class="cmd">${esc(CMD_SYNC)}</code>${copyBtn(CMD_SYNC, true)}
            <button class="btn" type="button" data-clearq="1">Show everything in this project</button>
          </div>
        </div>`
      : `<div class="empty" style="margin-top:28px">
          <h2>Nothing saved for ${esc(storeName)} yet.</h2>
          <p>This project has been set up but no conversation in it has been remembered yet.
          The other projects have ${n(t.records)} memories between them — pick one above.</p>
        </div>`) +
      (vecUnmeasured ? `<div class="note hatched">
        <span class="glyph" aria-hidden="true">⧅</span>
        <span><b>Whether this project can search by meaning was never checked.</b>
        ${esc(sentence(page.vectorReason || "No index file was found for it"))} That is unknown, not empty —
        a project with no reading is not a project that scored zero.</span></div>` : "");
  }

  const counts = page.rows.reduce((a, r) => {
    if (page.vectorStatus !== "ok" || r.hasVector === null) a.unchecked++;
    else if (r.hasVector) a.meaning++;
    else a.words++;
    return a;
  }, { meaning: 0, words: 0, unchecked: 0 });

  const shownWord = `of the ${n(page.rows.length)} on this page`;
  const filters = `<div class="filters">
      <span>${state.memQ
        ? `<b>${n(page.total)} ${plural(page.total, "memory", "memories")} in ${esc(storeName)} ${plural(page.total, "matches", "match")} “${esc(state.memQ)}”</b>`
        : `<b>${n(page.total)} ${plural(page.total, "memory", "memories")}</b> in ${esc(storeName)}, newest first`}</span>
      ${counts.meaning ? `<span class="tag" data-t="meaning"><span class="mk"></span>${n(counts.meaning)} ${shownWord} are findable by meaning</span>` : ""}
      ${counts.words ? `<span class="tag" data-t="words"><span class="mk"></span>${n(counts.words)} ${shownWord} match exact words only</span>` : ""}
      ${counts.unchecked ? `<span class="tag" data-t="unchecked">${statusMark("unmeasured")}${n(counts.unchecked)} ${shownWord} were never checked</span>` : ""}
      <span class="grow"></span>
      <label><input type="checkbox" id="hideclutter"${state.hideClutter ? " checked" : ""}>
        Hide the ${n(clutterCount)} clutter ${plural(clutterCount, "row", "rows")} on this page</label>
    </div>`;

  const body = rows.map((r) => `<div class="row"${r.lowSignal && r.lowSignal.length ? ' data-clutter="1"' : ""}>
      <div>
        <div class="txt">${esc(r.content)}</div>
        <div class="meta">${esc(shortDate(r.createdAt))} · topic: ${esc(r.scene || "none")} ·
          ${esc(VOCAB.writePath[r.writePath] || r.writePath)} · ${n(r.chars)} characters</div>
      </div>
      <div class="side">${rowTags(r, page)}</div>
    </div>`).join("");

  const ru = state.snapshot && state.snapshot.recallUsage;
  const recallLine = ru && ru.status === "ok" && ru.window && ru.window.firstAt
    ? `<span>Across ${n(ru.recalls)} recalls since ${esc(shortDate(ru.window.firstAt))}, ` +
      `<b>${n(ru.recalledIds)}</b> distinct ${plural(ru.recalledIds, "memory", "memories")} actually reached the assistant — ` +
      `the colour on each row is that in-window behaviour, not all-time.</span>`
    : "";

  return head + filters + `<div class="rows">${body}</div>` +
    footnote(`<span>Showing ${n(rows.length)} of ${n(page.total)}${
      page.total > page.rows.length ? ` — ${n(page.limit)} are read at a time` : ""}.
      ${state.hideClutter
        ? `${n(clutterCount)} clutter ${plural(clutterCount, "row is", "rows are")} hidden here but still counted in the total.`
        : "Clutter is shown and counted — hiding it by default would make the total a lie."}</span>${recallLine}`);
}

/* ══════════════════════════════════════════════════════════════════════
   Screen: What it knows about you
   ══════════════════════════════════════════════════════════════════════ */
function screenAboutYou() {
  if (state.loading) return screenHealthLoading();
  const persona = state.persona || (state.snapshot && state.snapshot.persona);
  if (state.personaError && !persona) return errorBlock(state.personaError, "What the assistant knows about you");
  if (!persona) return screenFatal(state.fatal || apiFailure("The persona could not be read.", "", ROUTES.PERSONA));

  const bullets = persona.bullets || [];
  const proj = persona.projection;

  if (persona.status === "unmeasured" || !bullets.length) {
    const records = state.snapshot ? state.snapshot.totals.records : 0;
    return `<div class="empty">
        <h2>Your assistant has not formed a picture of you yet.</h2>
        <p>${records ? `It has ${n(records)} memories from your conversations, but` : "It has no memories yet, so"}
        it has not worked out the standing pattern behind them — how you like proposals structured, what you always
        reject, which words you use for things.</p>
        <p>That happens automatically after enough sessions. You can also ask for it now; it reads the memories
        already saved and writes a summary you can edit by hand afterwards.</p>
        <div class="acts">
          <code class="cmd">/memory-consolidate</code>${copyBtn("/memory-consolidate", true)}
          <a class="btn" href="${esc(url(location.pathname, { view: "memories" }))}" data-view="memories">Read the memories instead</a>
        </div>
      </div>
      <div class="note hatched">
        <span class="glyph" aria-hidden="true">⧅</span>
        <span><b>Nothing is missing or broken.</b> ${esc(persona.reason || "There is simply no file to read yet")} —
        which is different from a file that was read and found empty. When one exists, this screen shows which parts
        of it reach the assistant and which do not.</span>
      </div>`;
  }

  const byTier = new Map(TIER_ORDER.map((t) => [t, []]));
  for (const b of bullets) {
    const t = byTier.has(b.tier) ? b.tier : "never";
    byTier.get(t).push(b);
  }

  const delivered = proj ? proj.byTier.sessionStart + proj.byTier.promptSummary : byTier.get("sessionStart").length;
  const longestNever = byTier.get("never").slice().sort((a, b) => b.chars - a.chars)[0];

  const head = `<h1 class="verdict sm">Of the ${n(bullets.length)} things written about you,
      <span class="${byTier.get("never").length ? "bad" : "ok"}">${n(delivered)} actually ${plural(delivered, "reaches", "reach")}</span> the assistant.</h1>
    <p class="verdict-sub">Grouped by what happens to each one, not by how it was filed: what arrives, what might, what never does.</p>`;

  const groups = TIER_ORDER.map((tier) => {
    const list = byTier.get(tier);
    if (!list.length) return "";
    const alwaysDropped = tier === "never" ? list.filter((b) => b.duty === "always").length : 0;
    const action = tier === "never" && longestNever
      ? `<span class="grow"></span><button class="btn primary" type="button" data-shorten="1">Shorten the longest one</button>` : "";
    return `<section class="group">
      <div class="head">
        <span class="t">${esc(VOCAB.tier[tier])}</span>
        <span class="c">${n(list.length)} of ${n(bullets.length)}${
          alwaysDropped ? ` — ${n(alwaysDropped)} of them marked “${esc(VOCAB.duty.always)}”` : ""}</span>
        ${action}
      </div>
      <ul class="plist">${list.map((b) => {
        const key = `${tier}:${b.section}:${b.ordinal}`;
        const label = esc(VOCAB.duty[b.duty] || b.duty);
        // The dashed chip has always said "this is the tool's guess, not your
        // label". Clicking it is the other half of that sentence: the reader's
        // correction, which is not in the payload and cannot be derived from it.
        // It goes to events.jsonl so the agent reads it on its next turn.
        // In `?demo=1` there is no server to post to and the bullets are
        // synthetic, so the chip is the plain, non-interactive pill it always
        // was — a control that can only ever fail is worse than no control.
        const note = CFG.demo ? "demo" : noteState(`duty:${key}`);
        const claim = note === "demo"
          ? `<span class="claim" title="The tool's guess, from how the line is written — not your label.">${label}</span>`
          : note === "saved"
          ? `<span class="claim noted">“${label}” — you said this is wrong ✓</span>`
          : note === "failed"
            ? `<span class="claim failed">“${label}” — could not save that note</span>`
            : `<button class="claim" type="button" data-duty="${esc(key)}"
                data-section="${esc(b.section)}" data-ordinal="${esc(b.ordinal)}" data-guess="${esc(b.duty)}" data-tier="${esc(tier)}"
                title="The tool's guess, from how the line is written — not your label. Click to tell your assistant it got this one wrong.">${label}</button>`;
        return `<li data-reach="${tier}">
          <span class="rule"></span>
          <span class="t">${clamped(b.text, key, state.expanded.has(key))}
            <span class="sec">${esc(b.section)} · ${n(b.chars)} characters${
              b.truncated ? " · cut short before it was handed over" : ""}</span></span>
          ${claim}
        </li>`;
      }).join("")}</ul>
    </section>`;
  }).join("");

  const why = proj ? `<div class="note warn">
      <span class="glyph" aria-hidden="true">⚠</span>
      <span><b>Why they are dropped: there is room for ${n(proj.tier0BudgetChars)} characters at the start of a session,
      and the ${n(proj.byTier.sessionStart)} that arrive already use ${n(proj.tier0Chars)}.</b>
      The ${n(proj.byTier.never)} that never arrive are not less important — they sit further down the file.
      Shortening one is the fastest way to get it delivered${longestNever ? `; the longest is ${n(longestNever.chars)} characters` : ""}.</span>
    </div>` : "";

  const detail = longestNever ? `<div class="card" id="shorten">
      <h2 class="h2">The longest one that never arrives</h2>
      <p class="lede">${n(longestNever.chars)} characters, in <b>${esc(longestNever.section)}</b>, marked
      “${esc(VOCAB.duty[longestNever.duty] || longestNever.duty)}”. Edit it in
      <span class="rootpath">${esc(persona.path || "your persona file")}</span> — this page only reads.</p>
      <pre class="quote">${esc(longestNever.text)}</pre>
      <div class="acts"><button class="btn" type="button" data-copy="${esc(longestNever.text)}">Copy the text</button>
        ${persona.path ? `<button class="btn" type="button" data-copy="${esc(persona.path)}">Copy the file path</button>` : ""}</div>
    </div>` : "";

  const table = proj ? `<table class="tbl">
      <caption>The same grouping as text — what happens to each of the ${n(bullets.length)} lines.</caption>
      <thead><tr><th scope="col">What happens to it</th><th class="num" scope="col">Lines</th><th class="num" scope="col">Characters</th></tr></thead>
      <tbody>${TIER_ORDER.map((t) => `<tr><td>${esc(VOCAB.tier[t])}</td>
        <td class="num">${n(proj.byTier[t])}</td><td class="num">${n(proj.byTierChars[t])}</td></tr>`).join("")}</tbody>
    </table>` : "";

  return head + groups + why + detail + (table ? `<div class="card">${table}</div>` : "") +
    footnote(`<span><b>“${esc(VOCAB.duty.always)}”, “${esc(VOCAB.duty.reference)}” — these are the tool's guesses, not your labels.</b>
      The dashed outline says so: the classification is a heuristic and it is wrong at the margins.${
        CFG.demo ? "" : " Click one to say it got that line wrong — the note is passed to your assistant for its next turn; this page still changes nothing."}</span>`);
}

/* ══════════════════════════════════════════════════════════════════════
   Screen: Try a prompt
   ══════════════════════════════════════════════════════════════════════ */
function screenTrace() {
  if (state.loading) return screenHealthLoading();
  if (state.fatal) return screenFatal(state.fatal);
  const snap = state.snapshot;
  const slug = state.traceSlug || CFG.slug || defaultSlug(snap);

  const head = `<h1 class="page-title">What your assistant would actually be handed</h1>
    <p class="lede">Type anything you would say to it. This runs the same lookup it runs — the real one, not a copy —
      and shows you the result.</p>
    <form class="search" id="traceform">
      <input type="search" id="traceq" value="${esc(state.recall ? state.recall.q : CFG.q)}"
        placeholder="for example: why did we drop the Postgres plan?" aria-label="A prompt to trace">
      ${storeSelect(snap, slug, "traceslug")}
      <button class="btn primary" type="submit">${state.recallLoading ? "Tracing…" : "Trace it"}</button>
    </form>`;

  if (state.recallError) {
    const e = state.recallError;
    return head + `<div class="note bad">
        <span class="glyph" aria-hidden="true">⚠</span>
        <span><b>The lookup failed: ${esc(e.detail || e.message)}</b>
        Your memories are not affected — nothing was written and nothing was lost.</span>
      </div>
      <div class="acts">
        <button class="btn primary" type="button" data-retrace="1">Try again</button>
        <a class="btn" href="${esc(url(location.pathname, { view: "memories" }))}" data-view="memories">Search exact words instead</a>
        <span class="tag">Failed at ${esc(shortTime(new Date().toISOString()))}</span>
      </div>
      <p class="footnote"><span>The request was <span class="id">${esc(e.target || ROUTES.RECALL)}</span>.</span></p>`;
  }

  if (state.recallLoading) {
    return head + `<div class="card">
        <h2 class="h2">This is what your assistant is handed</h2>
        <p class="lede">Running the same lookup the assistant runs…</p>
        <pre class="quote"><span class="sk line" style="width:62%"></span>
<span class="sk line" style="width:88%;margin-top:8px"></span>
<span class="sk line" style="width:74%;margin-top:8px"></span>
<span class="sk line" style="width:40%;margin-top:8px"></span></pre>
      </div>
      <p class="footnote"><span>The panel keeps its height, so the answer appears in place instead of pushing the page down.</span></p>`;
  }

  if (!state.recall) {
    const chips = state.examples && state.examples.length
      ? `<div class="acts" style="flex-wrap:wrap">${state.examples.map((x) =>
          `<button class="btn" type="button" data-example="${esc(x)}">${esc(x)}</button>`).join("")}</div>`
      : (state.examples === null
        ? `<p class="lede">Reading a few of your own prompts to suggest…</p>`
        : `<p class="lede">No short prompts could be read back out of this project — type one of your own.</p>`);
    return head + `<div class="empty" style="margin-top:24px;max-width:none">
        <h2>Start with one of your own.</h2>
        <p>These are real things you said, read back out of this project. Clicking one traces it.</p>
        ${chips}
      </div>
      <div class="card" style="max-width:92ch">
        <h2 class="h2">Why this screen exists</h2>
        <p class="lede">Your assistant is handed a small, automatically chosen slice of memory per turn — the lookup asks
        for at most 5 memories and about 280 tokens of them, out of ${n(snap.totals.records)}. When it forgets something
        you know you told it, the reason is almost always visible here: the memory was never saved, was saved as clutter,
        or lost the room to something else. This is also the only screen that can tell you how much actually reaches it,
        because that depends on what you ask.</p>
      </div>`;
  }

  const r = state.recall;
  // `injected` is true by construction for hits parsed back out of the block
  // (serve.js:864). A payload that also carries what was found and DROPPED marks
  // those false; nothing is invented when it does not.
  const all = r.hits || [];
  const hits = all.filter((h) => h.injected !== false);
  const dropped = all.filter((h) => h.injected === false);
  const vecUnmeasured = r.vectorStatus !== "ok";

  return head + `<div class="card">
      <h2 class="h2">This is what your assistant is handed</h2>
      <p class="lede">${n(hits.length)} ${plural(hits.length, "memory", "memories")}, ${n(r.injectedChars)} characters,
        found in ${n(r.tookMs)} ms. Word for word, no paraphrase — this is the block itself.</p>
      <pre class="quote">${esc(r.injected || "(nothing — the lookup returned an empty block)")}</pre>
    </div>
    ${hits.length ? `<div class="card">
      <h2 class="h2">The ${n(hits.length)} ${plural(hits.length, "line", "lines")}, one by one</h2>
      ${hits.some((h) => h.matchedBy)
        ? `<p class="lede">Which half of the search found each one — the words you typed, or their meaning.</p>`
        : `<p class="lede">Which half of the search found each one was not measured, so no line here claims to know.</p>`}
      <div class="hits">${hits.map((h, i) => `<div class="hit">
          <span class="n">${i + 1}</span>
          <span class="c">${esc(h.content)}</span>
          <span class="why">${h.matchedBy === "fts" ? "exact words" : h.matchedBy === "vector" ? "meaning" : h.matchedBy === "both" ? "both" : "—"}</span>
        </div>`).join("")}</div>
    </div>` : ""}
    ${dropped.length ? `<div class="card">
      <h2 class="h2">What was found but not handed over</h2>
      <p class="lede">${n(dropped.length)} more matched and were dropped — this is where “why didn't it remember that?” gets answered.</p>
      <div class="hits">${dropped.map((h, i) => `<div class="hit">
          <span class="n">${hits.length + i + 1}</span>
          <span class="c">${esc(h.content)}</span>
          <span class="why">${esc(h.dropReason || "no room left")}</span>
        </div>`).join("")}</div>
    </div>` : `<div class="note hatched">
      <span class="glyph" aria-hidden="true">⧅</span>
      <span><b>What was found and then dropped is not measured.</b>
      ${esc(sentence((r.attribution && r.attribution.reason) || "The recall path returns the finished block, not the ranking behind it"))}
      So this screen can tell you exactly what arrived, and cannot tell you what nearly did.</span>
    </div>`}
    ${vecUnmeasured ? `<div class="note warn">
      <span class="glyph" aria-hidden="true">⚠</span>
      <span><b>This ran on exact words only.</b> ${esc(sentence(r.vectorReason || "The meaning half of the search was not available"))}
      A memory that means the same thing in different words was not found — and would not be found for the assistant either.
      <code class="cmd">${esc(CMD_SYNC)}</code></span>
    </div>` : ""}
    ${footnote(`<span>Traced ${state.samples.length === 1 ? "once" : n(state.samples.length) + " times"} in this session —
      that is what the “reaches the assistant each turn” line on the health screen is reading.</span>`)}`;
}

/* ══════════════════════════════════════════════════════════════════════
   Failure screens — an honest message naming what failed. Never a blank
   screen, and never a silent fall back to the fixture.
   ══════════════════════════════════════════════════════════════════════ */
function errorBlock(err, what) {
  return `<div class="note bad">
      <span class="glyph" aria-hidden="true">⚠</span>
      <span><b>${esc(what)} could not be read.</b><br>${esc(sentence(err.message || String(err)))}
      ${err.detail ? `<br>${esc(sentence(err.detail))}` : ""}
      <br>Nothing is shown here rather than something wrong. Your memories are not affected — this page only reads.</span>
    </div>
    <div class="acts"><button class="btn primary" type="button" data-reload="1">Try again</button></div>`;
}

function screenFatal(err) {
  const target = (err && err.target) || "the API";
  return `<h1 class="verdict sm"><span class="bad">tmem view could not read your memory folder.</span></h1>
    <p class="verdict-sub">${esc(sentence((err && err.message) || "The request failed"))}
      ${err && err.detail ? esc(sentence(err.detail)) : ""}</p>
    <div class="card">
      <h2 class="h2">What failed, exactly</h2>
      <dl class="kv">
        <dt>The request</dt><dd><span class="mono">${esc(target)}</span></dd>
        <dt>What it means</dt><dd>The server behind this page did not answer with a readable snapshot.
          Your memories are untouched — nothing on this page writes.</dd>
        <dt>What to try</dt><dd><code class="cmd">tmem view</code>${copyBtn("tmem view", false)} in a terminal, then reload.</dd>
      </dl>
    </div>
    <div class="acts">
      <button class="btn primary" type="button" data-reload="1">Try again</button>
      ${CFG.demo ? "" : `<a class="btn" href="${esc(url(location.pathname, { demo: 1 }))}">Open the development fixture instead</a>`}
    </div>
    <p class="footnote"><span>The fixture is invented data, labelled as such. It is offered here as a link you choose,
      never as a silent substitute for your store.</span></p>`;
}

function screenNotFound(msg) {
  return `<div class="empty"><h2>${esc(msg)}</h2>
    <p><a class="btn" href="${esc(url(location.pathname, { view: "health" }))}" data-view="health">Back to health</a></p></div>`;
}

/* ══════════════════════════════════════════════════════════════════════
   Render + routing
   ══════════════════════════════════════════════════════════════════════ */
function render() {
  const app = document.getElementById("app");
  let html;
  try {
    html = CFG.view === "memories" ? screenMemories()
      : CFG.view === "about-you" ? screenAboutYou()
      : CFG.view === "trace" ? screenTrace()
      : CFG.view === "problem" ? screenProblem()
      : screenHealth();
  } catch (e) {
    html = errorBlock({ message: "This screen could not be drawn from the snapshot.", detail: String((e && e.message) || e) }, "The screen");
  }
  app.innerHTML = html;
  renderTabs();
  document.title = "tmem view — " + ((VIEWS.find((v) => v.id === CFG.view) || { label: "a finding" }).label);
}

function go(view, params) {
  CFG.view = view;
  CFG.gap = (params && params.gap) || "";
  const u = url(location.pathname, Object.assign({
    view,
    gap: CFG.gap,
    theme: CFG.theme !== "auto" ? CFG.theme : "",
    demo: CFG.demo ? 1 : "",
    static: P.get("static") === "1" ? 1 : "",
  }, {}));
  history.pushState({ view, gap: CFG.gap }, "", u);
  render();
  window.scrollTo(0, 0);
  document.getElementById("app").focus();
  afterNavigate();
}

window.addEventListener("popstate", () => {
  const p = new URLSearchParams(location.search);
  CFG.view = VIEW_IDS.includes(p.get("view")) ? p.get("view") : "health";
  CFG.gap = p.get("gap") || "";
  render();
  afterNavigate();
});

/** Screens that need their own fetch ask for it once, when first shown. */
function afterNavigate() {
  if (state.loading || state.fatal) return;
  if (CFG.view === "memories" && !state.records && !state.recordsLoading && !state.recordsError) loadRecords();
  if (CFG.view === "trace" && state.examples === null && !state.recall && !CFG.demo) loadExamples();
}

/* ══════════════════════════════════════════════════════════════════════
   Data
   ══════════════════════════════════════════════════════════════════════ */
async function loadRecords() {
  const snap = state.snapshot;
  if (!snap) return;
  const slug = state.memSlug || defaultSlug(snap);
  state.memSlug = slug;
  state.recordsLoading = true; state.recordsError = null; render();
  try {
    if (CFG.demo) {
      const fx = loadFixture();
      if (!fx.records) {
        throw apiFailure("The development fixture carries no record rows.",
          "Run tmem view against a real store to see this screen with data.", "fixture");
      }
      state.records = fx.records;
    } else {
      state.records = await api(ROUTES.RECORDS(slug), { q: state.memQ, limit: 100 });
    }
  } catch (e) {
    state.recordsError = e;
  }
  state.recordsLoading = false;
  render();
}

/**
 * Three real prompts from this store, for the trace screen's chips. Read from
 * the store rather than invented: an example prompt nobody ever typed would be
 * the same lie as a fabricated figure, one screen further along.
 */
async function loadExamples() {
  try {
    const slug = state.traceSlug || CFG.slug || defaultSlug(state.snapshot);
    const page = await api(ROUTES.RECORDS(slug), { limit: 100, writePath: "auto" });
    state.examples = (page.rows || [])
      .filter((r) => r.chars > 12 && r.chars < 70 && !(r.lowSignal && r.lowSignal.length))
      .slice(0, 3)
      .map((r) => r.content.replace(/\s+/g, " ").trim());
  } catch (e) {
    state.examples = [];
  }
  if (CFG.view === "trace") render();
}

async function runTrace(q, slug) {
  state.recallLoading = true; state.recallError = null; state.recall = null;
  if (CFG.view !== "trace") { CFG.view = "trace"; }
  render();
  try {
    const data = CFG.demo ? loadFixture().recall : await api(ROUTES.RECALL, { q, slug });
    state.recall = data;
    // The measurement the health screen's counterweight is waiting for.
    if (!CFG.demo) {
      state.samples.push({
        q,
        hits: (data.hits || []).filter((h) => h.injected !== false).length,
        chars: data.injectedChars,
        snapshotId: state.snapshot ? (state.snapshot.snapshotId || state.snapshotId) : state.snapshotId,
        at: Date.now(),
      });
      saveSamples();
    }
  } catch (e) {
    state.recallError = e;
  }
  state.recallLoading = false;
  render();
}

/** Samples survive a reload, but only against the snapshot they were taken on. */
function saveSamples() {
  try { sessionStorage.setItem("tmem.samples", JSON.stringify(state.samples)); } catch (e) { /* private mode */ }
}
function restoreSamples() {
  try {
    const raw = sessionStorage.getItem("tmem.samples");
    state.samples = raw ? (JSON.parse(raw) || []) : [];
  } catch (e) { state.samples = []; }
}

function openChannel() {
  if (CFG.static) { chan("static", CFG.demo ? "demo fixture — not live" : "static — no live channel"); return; }
  if (typeof EventSource === "undefined") { chan("lost", "no EventSource in this browser"); return; }
  let es;
  try { es = new EventSource(url(ROUTES.EVENTS)); }
  catch (e) { chan("lost", "live channel unavailable"); return; }

  es.onopen = () => chan("live", "watching for changes");
  es.onerror = () => chan("lost", "live channel lost — figures may be stale");
  es.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch (_) { return; }
    if (!msg || msg.type !== "snapshot" || !msg.snapshotId) return;
    if (!state.snapshotId) { state.snapshotId = msg.snapshotId; return; }
    if (msg.snapshotId === state.snapshotId) return;

    // Trace is the one screen that MAY re-render under the reader: it answers
    // "what reaches the assistant for THIS prompt", so a stale answer is worse
    // than a moving one. Re-run the last query against the new store and advance
    // the baseline so this drift counts as consumed. Every other screen keeps the
    // deliberate offer-refresh contract (showChangedBadge, never re-render silently).
    const lastQ = (state.recall && state.recall.q) || CFG.q;
    if (CFG.view === "trace" && lastQ && !state.recallLoading) {
      state.snapshotId = msg.snapshotId;
      chan("live", "updated live — store changed");
      runTrace(lastQ, state.traceSlug || defaultSlug(state.snapshot));
      return;
    }
    showChangedBadge();
  };
}

async function boot() {
  applyTheme(CFG.theme);
  restoreSamples();
  render();          // the loading state, at the final heights

  if (CFG.demo) {
    const fx = loadFixture();
    state.snapshot = fx.snapshot;
    state.persona = fx.persona;
    state.snapshotId = fx.snapshot.snapshotId;
    state.records = fx.records || null;
    state.examples = [];
    state.loading = false;
    if (CFG.q || CFG.view === "trace") state.recall = fx.recall;
    chan("static", "demo fixture — not live");
    render();
    return;
  }

  const [snapRes, persRes] = await Promise.allSettled([api(ROUTES.SNAPSHOT), api(ROUTES.PERSONA)]);
  state.loading = false;

  if (snapRes.status === "fulfilled") {
    state.snapshot = snapRes.value;
    state.snapshotId = state.snapshot.snapshotId || state.snapshotId;
    state.samples = state.samples.filter((s) => s.snapshotId === state.snapshotId);
  } else {
    state.fatal = snapRes.reason;
  }
  if (persRes.status === "fulfilled") state.persona = persRes.value;
  else state.personaError = persRes.reason;

  render();
  openChannel();
  if (CFG.q && state.snapshot) {
    await runTrace(CFG.q, CFG.slug || defaultSlug(state.snapshot));
  } else {
    afterNavigate();
  }
}

/* ══════════════════════════════════════════════════════════════════════
   Events — delegated, because every screen is re-rendered from scratch
   ══════════════════════════════════════════════════════════════════════ */
document.addEventListener("click", async (ev) => {
  const t = ev.target;
  if (!t || !t.closest) return;

  const nav = t.closest("a[data-view]");
  if (nav) {
    ev.preventDefault();
    go(nav.getAttribute("data-view"), { gap: nav.getAttribute("data-gap") || "" });
    return;
  }

  const copy = t.closest("[data-copy]");
  if (copy) {
    const text = copy.getAttribute("data-copy");
    const done = () => {
      const old = copy.textContent;
      copy.textContent = "Copied";
      setTimeout(() => { copy.textContent = old; }, 1400);
    };
    try { await navigator.clipboard.writeText(text); done(); }
    catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (_) { copy.textContent = "Press Ctrl+C"; }
      ta.remove();
    }
    return;
  }

  // ── The two judgement notes. See postEvent(): these are the only interactions
  // that leave the browser, because they are the only ones the payload cannot
  // recompute. Both send identifiers only — never memory text or a prompt.
  const duty = t.closest("[data-duty]");
  if (duty) {
    const key = `duty:${duty.getAttribute("data-duty")}`;
    if (noteState(key)) return;
    const ok = await postEvent({
      kind: "duty.dispute",
      section: duty.getAttribute("data-section"),
      ordinal: Number(duty.getAttribute("data-ordinal")),
      guessedDuty: duty.getAttribute("data-guess"),
      tier: duty.getAttribute("data-tier"),
    });
    state.noted.set(key, ok ? "saved" : "failed");
    render();
    return;
  }

  const ackEl = t.closest("[data-ack]");
  if (ackEl) {
    const kind = ackEl.getAttribute("data-ack");
    const key = `gap:${kind}`;
    if (noteState(key)) return;
    const p = (state.snapshot ? buildProblems(state.snapshot) : []).find((x) => x.kind === kind);
    const ok = await postEvent({
      kind: "gap.ack",
      gapKind: kind,
      gapId: (p && p.gaps[0] && p.gaps[0].id) || `${kind}:root`,
      gapCount: (p && p.gaps.length) || 1,
      severity: (p && p.sev) || null,
    });
    state.noted.set(key, ok ? "saved" : "failed");
    render();
    return;
  }

  if (t.closest("[data-reload]")) { location.reload(); return; }

  const ex = t.closest("[data-example]");
  if (ex) { runTrace(ex.getAttribute("data-example"), state.traceSlug || CFG.slug || defaultSlug(state.snapshot)); return; }

  if (t.closest("[data-retrace]")) {
    const field = document.getElementById("traceq");
    const q = (state.recall && state.recall.q) || (field && field.value.trim()) || CFG.q;
    if (q) runTrace(q, state.traceSlug || defaultSlug(state.snapshot));
    return;
  }

  if (t.closest("[data-clearq]")) { state.memQ = ""; state.records = null; loadRecords(); return; }

  if (t.closest("[data-shorten]")) {
    const el = document.getElementById("shorten");
    if (el) { el.scrollIntoView({ block: "center" }); const b = el.querySelector(".btn"); if (b) b.focus(); }
    return;
  }

  const exp = t.closest("[data-expand]");
  if (exp) { state.expanded.add(exp.getAttribute("data-expand")); render(); return; }
  const col = t.closest("[data-collapse]");
  if (col) { state.expanded.delete(col.getAttribute("data-collapse")); render(); return; }

  if (t.id === "theme-toggle") {
    applyTheme({ auto: "light", light: "dark", dark: "auto" }[CFG.theme] || "auto");
  }
});

document.addEventListener("submit", (ev) => {
  const f = ev.target;
  if (f.id === "memform") {
    ev.preventDefault();
    state.memQ = document.getElementById("memq").value.trim();
    state.memSlug = document.getElementById("memslug").value;
    state.records = null;
    loadRecords();
    return;
  }
  if (f.id === "traceform") {
    ev.preventDefault();
    const q = document.getElementById("traceq").value.trim();
    state.traceSlug = document.getElementById("traceslug").value;
    if (q) runTrace(q, state.traceSlug);
  }
});

document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.id === "hideclutter") { state.hideClutter = t.checked; render(); return; }
  if (t.id === "memslug") { state.memSlug = t.value; state.records = null; loadRecords(); return; }
  if (t.id === "traceslug") { state.traceSlug = t.value; }
});

boot().catch((e) => {
  state.loading = false;
  state.fatal = e;
  render();
});
</script>
</body>
</html>
