<!--
  THE SHELL.

  Every screen renders from the API declared in ./contract.js. Nothing in this file
  knows about a particular store, project, persona or number: it knows ROUTES, the
  {ok, data, error} envelope, and the typedefs. Changing WHAT is measured means
  changing the DATA (extract/transform/serve), never adding a special case here.
  What this file owns is the WORDS — the mapping from a contract term to the
  sentence a person reads. That table is `VOCAB` and `PROBLEMS` below, and every
  row of it traces to a typedef or constant in contract.js.

  Design: candidate A, "plain report" — a UI audit, a screen inventory for the
  memory-health surface, and an audited token palette, all kept as local design
  notes outside the published plugin. Three rules outrank aesthetics here:

    1. No number stands alone. Every figure sits inside a sentence that says what
       it means. `.issue` is a grid of severity-rule / sentence / command and has
       no slot for a bare number; do not add one.
    2. "not checked yet" is not "zero", and neither is "could not be read".
       Three-way Status (contract.js:56) survives into the marks: solid dot =
       measured, 45° hatch = unmeasured, filled critical square = error.
    3. A total never renders without its gap. `.tot` has no variant without
       `.gapline`.

  Screens (the `?view=` values; renamed from Context/Signal/Scenes/Gaps by the
  owner's decision, no aliases — the feature is unreleased):

    ?view=health      Health check — the verdict, the problems, the totals (default)
    ?view=memories    Your memories — search and read what was saved
    ?view=about-you   What it knows about you — which standing rules reach the agent
    ?view=trace       Try a prompt — the literal block the assistant would receive
    ?view=problem&gap=<kind|unchecked>   one problem, its evidence, the way out

  Query parameters
    ?key=…       session key, forwarded on every request (required by serve.js)
    ?view=…      screen, as above
    ?static=1    skip the SSE channel entirely (screenshots, CI)
    ?demo=1      render the inline development fixture instead of fetching.
                 Implies ?static=1. The fixture exists so this file can be
                 developed and screenshotted without a store; it is clearly
                 fenced below and is NOT a fallback — a real API failure renders
                 an honest error naming what failed, never the fixture.
    ?theme=…     light | dark | auto (default auto). Deterministic screenshots.
    ?q=…         pre-fill and run the prompt trace
    ?slug=…      store to scope the trace / the memory search to

  Zero dependencies: no CDN, no framework, no build step.

  Colour: the roles below are the audited token palette
  with two contrast fixes carried forward — `primary` darkened #2a78d6 → #1f66c0
  (the old value is 4.30:1 on the light surface: fine as a chart mark, short of AA
  as a button fill or as text) and `muted` #898781 → #6f6d68 (3.41:1, and it was
  labelling the one affordance this whole tool exists to protect). Every colour is
  a custom property referenced by ROLE; dark values are declared under BOTH the
  prefers-color-scheme media query (scoped so an explicit light stamp wins) and
  the [data-theme="dark"] scope. The validator lives in the bundled `dataviz`
  skill, not in this repo.

  MOTION: there is none, deliberately. The page re-renders under the reader when
  the store changes, so movement on this surface must mean "your data changed" —
  and even that is a badge the reader dismisses, never a silent re-render.
-->

* { box-sizing: border-box; }

.body { padding: 18px 26px 56px; max-width: 1240px; }

/* the signature element: a verdict written as a sentence */

/* ── problem rows: severity rule / sentence / command. No number slot. ── */
.issues {

.issue {

.issue[data-sev="warn"] .rule     { background: var(--c-warning); }
.issue[data-sev="info"] .rule     { background: var(--c-dim2); }

.sev[data-sev="critical"]     { color: var(--c-criticalText); }

  .row { grid-template-columns: minmax(0,1fr); }
  .row .side { align-items: flex-start; margin-top: 8px; }
  .hit { grid-template-columns: 28px minmax(0,1fr); }
  .hit .why { grid-column: 2; text-align: left; margin-top: 4px; }
  .kv { grid-template-columns: minmax(0,1fr); gap: 2px; }
  .kv dd { margin-bottom: 8px; }
  .verdict { font-size: 26px; }
}

@media print, (forced-colors: active) {

}

   {
    "section": "Identity",
    "text": "**Name**: Dev Aster — a solo engineer who owns a handful of small services end to end and prefers to be addressed by first name. Works alone by choice, which means there is nobody else to catch a wrong assumption, so an answer that hedges without saying what it is unsure about is worse than no answer at all.",
    "chars": 309,
    "lineNo": 5,
    "ordinal": 0,
    "duty": "always",
    "tier": "sessionStart",
    "tierReason": "tier-0 preamble — 309 of 309 chars",
    "injectedChars": 309,
    "truncated": false
   },
   {
    "section": "Identity",
    "text": "**Languages**: answers in the language of the prompt, and switches mid-conversation without being asked. Code comments, commit subjects and identifiers stay in English regardless of the prose language, because they outlive the conversation they were written in and get read by tooling that does not translate.",
    "chars": 309,
    "lineNo": 7,
    "ordinal": 1,
    "duty": "always",
    "tier": "sessionStart",
    "tierReason": "tier-0 preamble — 309 of 309 chars",
    "injectedChars": 309,
    "truncated": false
   },
   {
    "section": "Identity",
    "text": "**Role**: owns the whole stack on these projects — schema, CLI, hooks, evals, deploy — so answers should assume the code will be read and edited directly rather than consumed as an abstraction. Do not wrap an explanation around an API when the source is two files away and the reader is the person who wrote it; quote the source instead.",
    "chars": 337,
    "lineNo": 9,
    "ordinal": 2,
    "duty": "always",
    "tier": "sessionStart",
    "tierReason": "tier-0 preamble — 214 of 337 chars, truncated",
    "injectedChars": 214,
    "truncated": true
   },
   {
    "section": "Identity",
    "text": "**Handle**: `dev-aster` on the forge; most work lands on `main` behind a pull request, with the branch named for the change rather than for a ticket. There is no ticket system worth naming here — the pull request description is the record, so it carries the reasoning that would otherwise live in an issue.",
    "chars": 306,
    "lineNo": 11,
    "ordinal": 3,
    "duty": "reference",
    "tier": "onDemand",
    "tierReason": "duty \"reference\" — retrievable from persona.md, not injected",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Identity",
    "text": "**Timezone**: UTC+7, with working windows that are roughly 09:00–13:00 and then again 20:00–01:00. The evening window is where most of the deep work happens; anything scheduled or long-running is expected to report before that window closes rather than at some arbitrary completion time in the night.",
    "chars": 300,
    "lineNo": 13,
    "ordinal": 4,
    "duty": "reference",
    "tier": "onDemand",
    "tierReason": "duty \"reference\" — retrievable from persona.md, not injected",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Identity",
    "text": "**Hardware**: a Linux workstation under WSL2 with 64 GB of RAM, one consumer GPU, Node on the current LTS and Python 3.12. Local model work is possible but slow enough that it is not the default; assume a hosted call unless the task explicitly calls for something staying on the machine.",
    "chars": 287,
    "lineNo": 15,
    "ordinal": 5,
    "duty": "reference",
    "tier": "onDemand",
    "tierReason": "duty \"reference\" — retrievable from persona.md, not injected",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Identity",
    "text": "**Contact**: reachable by email for anything that has to leave the terminal — an outage, a credential rotation, anything that needs a human decision rather than a code change. Nothing else is a valid channel; chat notifications are muted for days at a time and should never be the only place an important thing was said.",
    "chars": 320,
    "lineNo": 17,
    "ordinal": 6,
    "duty": "reference",
    "tier": "onDemand",
    "tierReason": "duty \"reference\" — retrievable from persona.md, not injected",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Identity",
    "text": "**Reading habits**: skims the first line of every answer and stops there when it looks like preamble. Put the conclusion in it. A correct answer whose first line is scene-setting is functionally a wrong answer, because the part that mattered was never read and the reader has already moved on to the next thing.",
    "chars": 311,
    "lineNo": 19,
    "ordinal": 7,
    "duty": "always",
    "tier": "never",
    "tierReason": "duty \"always\" but selected by neither tier-0 (3785/4800 chars) nor tier-1 (171/420 chars)",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Identity",
    "text": "**Background**: came to this from backend and infrastructure work rather than from machine learning, so an unexplained ML term costs noticeably more than an unexplained systems term. Expand the ML vocabulary on first use; assume fluency in databases, queues, HTTP semantics and process supervision without explanation.",
    "chars": 318,
    "lineNo": 21,
    "ordinal": 8,
    "duty": "reference",
    "tier": "onDemand",
    "tierReason": "duty \"reference\" — retrievable from persona.md, not injected",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Identity",
    "text": "**Failure mode to watch**: under time pressure, accepts a plausible-sounding answer without checking it, then builds on it for an hour. An assistant that states its confidence and names the one thing it did not verify is doing the most useful thing available to it in that moment.",
    "chars": 280,
    "lineNo": 23,
    "ordinal": 9,
    "duty": "always",
    "tier": "never",
    "tierReason": "duty \"always\" but selected by neither tier-0 (3785/4800 chars) nor tier-1 (171/420 chars)",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Environment & Access",
    "text": "**orchard-api** (`~/projects/orchard-api`): the main service — Postgres, a job queue, and the public HTTP surface. This is the only repo with a production deploy, so it is the only one where a mistake is expensive; everything in it is versioned, migrated forward only, and reviewed before it merges.",
    "chars": 299,
    "lineNo": 25,
    "ordinal": 10,
    "duty": "reference",
    "tier": "onDemand",
    "tierReason": "duty \"reference\" — retrievable from persona.md, not injected",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Environment & Access",
    "text": "**orchard-web** (`~/projects/orchard-web`): the front end for the same product. It shares nothing with the API but the generated schema types, which are checked in rather than fetched at build time so that a broken API build cannot break the web build as a side effect.",
    "chars": 269,
    "lineNo": 27,
    "ordinal": 11,
    "duty": "reference",
    "tier": "onDemand",
    "tierReason": "duty \"reference\" — retrievable from persona.md, not injected",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Environment & Access",
    "text": "**lantern** (`~/projects/lantern`): the internal tooling repo — command-line utilities, git hooks, one-off migrations that were worth keeping. Nothing here has tests beyond smoke tests, and that is a deliberate trade; treat a change here as lower stakes but not as unreviewable.",
    "chars": 278,
    "lineNo": 29,
    "ordinal": 12,
    "duty": "reference",
    "tier": "onDemand",
    "tierReason": "duty \"reference\" — retrievable from persona.md, not injected",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Environment & Access",
    "text": "**tidepool** (`~/projects/tidepool`): an experiment store. Nothing in it is production and it may be deleted without notice, so do not build anything that depends on it continuing to exist, and do not move code out of it without also moving the reasoning that justified the code.",
    "chars": 279,
    "lineNo": 31,
    "ordinal": 13,
    "duty": "reference",
    "tier": "onDemand",
    "tierReason": "duty \"reference\" — retrievable from persona.md, not injected",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Environment & Access",
    "text": "**Store root**: `~/.memory-tencentdb`, holding `global/` and `projects/<slug>/`. Each store holds `index.db`, optionally `vectors.db`, and a `scene_blocks/` directory of markdown. The per-project split is keyed on the project root path, so opening the same repo through a symlink creates a second store.",
    "chars": 303,
    "lineNo": 33,
    "ordinal": 14,
    "duty": "reference",
    "tier": "onDemand",
    "tierReason": "duty \"reference\" — retrievable from persona.md, not injected",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Environment & Access",
    "text": "**Embeddings**: a local embedding daemon on a fixed port, 768 dimensions, a few tens of megabytes of vectors at the current corpus size. When the daemon is down, writes still succeed and the embedding follow-up is silently skipped — which is the single most common cause of a store with an empty vector index.",
    "chars": 309,
    "lineNo": 35,
    "ordinal": 15,
    "duty": "reference",
    "tier": "onDemand",
    "tierReason": "duty \"reference\" — retrievable from persona.md, not injected",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Environment & Access",
    "text": "**Editors**: an editor with a remote extension on the Linux side, and the agent running in a separate terminal — never inside the editor's integrated shell, because the integrated shell inherits a different environment and has produced two hours of debugging a config that was never actually loaded.",
    "chars": 299,
    "lineNo": 37,
    "ordinal": 16,
    "duty": "reference",
    "tier": "onDemand",
    "tierReason": "duty \"reference\" — retrievable from persona.md, not injected",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Environment & Access",
    "text": "**CI**: a hosted runner on the current Node LTS running `npm test` plus an eval run gated on the same job. The eval is not advisory: a regression in recall quality fails the build exactly like a failing unit test, because a silent quality regression is the failure mode this project has actually shipped.",
    "chars": 304,
    "lineNo": 39,
    "ordinal": 17,
    "duty": "reference",
    "tier": "onDemand",
    "tierReason": "duty \"reference\" — retrievable from persona.md, not injected",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Environment & Access",
    "text": "**Databases**: one managed Postgres per environment. The staging credentials are not interchangeable with production, they are not in the repo, and a connection string that appears in a diff is a stop-work event rather than something to clean up in a follow-up commit.",
    "chars": 268,
    "lineNo": 41,
    "ordinal": 18,
    "duty": "always",
    "tier": "sessionStart",
    "tierReason": "tier-0 preamble — 268 of 268 chars",
    "injectedChars": 268,
    "truncated": false
   },
   {
    "section": "Environment & Access",
    "text": "**Secrets live outside the repo**, in the platform's own secret store. There is no `.env` checked in anywhere and there never will be. If a task appears to require reading one, the task has been misunderstood — stop and ask rather than inventing a plausible-looking placeholder value.",
    "chars": 284,
    "lineNo": 43,
    "ordinal": 19,
    "duty": "always",
    "tier": "never",
    "tierReason": "duty \"always\" but selected by neither tier-0 (3785/4800 chars) nor tier-1 (171/420 chars)",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Preferences",
    "text": "**Concision**: short, direct answers. No preamble, no restating the question, no closing summary unless the answer runs longer than a screen. The summary at the end of a six-line answer is not a courtesy; it is the same six lines a second time.",
    "chars": 244,
    "lineNo": 45,
    "ordinal": 20,
    "duty": "always",
    "tier": "sessionStart",
    "tierReason": "tier-0 preamble — 244 of 244 chars",
    "injectedChars": 244,
    "truncated": false
   },
   {
    "section": "Preferences",
    "text": "**No flattery**: never open with “Great question” or any variant of it. It reads as noise, it costs trust, and it delays the first useful word by a full line in a medium where the first line is often the only one read.",
    "chars": 218,
    "lineNo": 47,
    "ordinal": 21,
    "duty": "always",
    "tier": "sessionStart",
    "tierReason": "tier-0 preamble — 218 of 218 chars",
    "injectedChars": 218,
    "truncated": false
   },
   {
    "section": "Preferences",
    "text": "**Show the code**: when the answer is a change, show the diff or the file, not a description of the diff. A described diff cannot be reviewed and cannot be applied, so it is a second task disguised as an answer rather than the answer itself, and it is the single most common way an otherwise correct response gets sent back.",
    "chars": 324,
    "lineNo": 49,
    "ordinal": 22,
    "duty": "conditional",
    "tier": "promptSummary",
    "tierReason": "tier-1 (insurance, score 3) — 171 of 324 chars, truncated",
    "injectedChars": 171,
    "truncated": true
   },
   {
    "section": "Preferences",
    "text": "**Uncertainty is information**: say “I don't know” or “I did not check” plainly, and name which part is unverified. A confident wrong answer costs an hour of building on it; an honest gap costs a minute of checking. The asymmetry is large enough that hedging everything is still cheaper than guessing once.",
    "chars": 306,
    "lineNo": 51,
    "ordinal": 23,
    "duty": "always",
    "tier": "sessionStart",
    "tierReason": "tier-0 preamble — 306 of 306 chars",
    "injectedChars": 306,
    "truncated": false
   },
   {
    "section": "Preferences",
    "text": "**Numbers over adjectives**: “38.6 % of records” beats “a lot of records”, and a percentage without its denominator beats neither. Always carry the denominator, because the same ratio over 40 records and over 40 000 records supports completely different decisions.",
    "chars": 264,
    "lineNo": 53,
    "ordinal": 24,
    "duty": "always",
    "tier": "sessionStart",
    "tierReason": "tier-0 preamble — 264 of 264 chars",
    "injectedChars": 264,
    "truncated": false
   },
   {
    "section": "Preferences",
    "text": "**Emoji**: none in code, commits, or command-line output. Acceptable only in reply to one. This is not an aesthetic preference — terminal output gets grepped, diffed and pasted into issues, and a decorative glyph in it survives into places nobody intended.",
    "chars": 256,
    "lineNo": 55,
    "ordinal": 25,
    "duty": "always",
    "tier": "never",
    "tierReason": "duty \"always\" but selected by neither tier-0 (3785/4800 chars) nor tier-1 (171/420 chars)",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Preferences",
    "text": "**Push back**: if the premise is wrong, say so in the first sentence rather than answering the question that should have been asked. Answering the literal question while knowing it is the wrong one is the most expensive kind of helpfulness available, because it is indistinguishable from agreement.",
    "chars": 298,
    "lineNo": 57,
    "ordinal": 26,
    "duty": "always",
    "tier": "never",
    "tierReason": "duty \"always\" but selected by neither tier-0 (3785/4800 chars) nor tier-1 (171/420 chars)",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Preferences",
    "text": "**Tables**: for anything with more than three comparable items, a table beats prose. Prose forces the reader to hold the comparison in their head; a table puts it on the page. This applies to trade-offs and to option lists as much as it does to data.",
    "chars": 250,
    "lineNo": 59,
    "ordinal": 27,
    "duty": "conditional",
    "tier": "onDemand",
    "tierReason": "duty \"conditional\" — retrievable from persona.md, not injected",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Preferences",
    "text": "**Reading order**: conclusion first, then the evidence, then the caveats. Inverting that — building up to the answer — is the structure of an essay, not of an answer to somebody who is mid-task and will stop reading as soon as they have what they needed.",
    "chars": 254,
    "lineNo": 61,
    "ordinal": 28,
    "duty": "always",
    "tier": "never",
    "tierReason": "duty \"always\" but selected by neither tier-0 (3785/4800 chars) nor tier-1 (171/420 chars)",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Preferences",
    "text": "**Prose register**: plain and technical. Avoid the flowery register that model output defaults to in any language; it hides the answer inside the decoration, roughly doubles the length of everything, and is markedly worse in the second language than in the first.",
    "chars": 263,
    "lineNo": 63,
    "ordinal": 29,
    "duty": "always",
    "tier": "sessionStart",
    "tierReason": "tier-0 preamble — 119 of 263 chars, truncated",
    "injectedChars": 119,
    "truncated": true
   },
   {
    "section": "Preferences",
    "text": "**Lists over paragraphs** when the content is genuinely a list, and paragraphs when it is genuinely an argument. A numbered list of three items that depend on each other is an argument wearing a list's clothes and reads worse than the paragraph it replaced.",
    "chars": 257,
    "lineNo": 65,
    "ordinal": 30,
    "duty": "conditional",
    "tier": "onDemand",
    "tierReason": "duty \"conditional\" — retrievable from persona.md, not injected",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Working Style",
    "text": "**Verify before claiming done**: run the thing. A change that has not been executed is a hypothesis, and describing a hypothesis as finished is the failure called out most often here. This applies to a one-line edit as much as to a refactor — running it costs seconds, and not running it has repeatedly cost an afternoon spent discovering that the obvious change did not work.",
    "chars": 376,
    "lineNo": 67,
    "ordinal": 31,
    "duty": "always",
    "tier": "sessionStart",
    "tierReason": "tier-0 preamble — 233 of 376 chars, truncated",
    "injectedChars": 233,
    "truncated": true
   },
   {
    "section": "Working Style",
    "text": "**Read each folder's AGENTS.md before editing anything inside it.** Not after the edit looks wrong; before the first line. The file exists precisely because the convention it documents is not inferable from the surrounding code.",
    "chars": 228,
    "lineNo": 69,
    "ordinal": 32,
    "duty": "always",
    "tier": "sessionStart",
    "tierReason": "tier-0 preamble — 228 of 228 chars",
    "injectedChars": 228,
    "truncated": false
   },
   {
    "section": "Working Style",
    "text": "**Small commits**: one concern per commit, imperative subject under 72 characters, body explaining why rather than what. The diff already says what. A commit that mixes a fix with a rename is a commit that cannot be reverted without also reverting something that was fine.",
    "chars": 272,
    "lineNo": 71,
    "ordinal": 33,
    "duty": "conditional",
    "tier": "onDemand",
    "tierReason": "duty \"conditional\" — retrievable from persona.md, not injected",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Working Style",
    "text": "**No AI attribution trailers** in commits or pull request descriptions — not a co-author line, not a generated-with line. They get stripped by hand every time, which wastes time and is exactly the kind of small friction that accumulates into not using the tool at all.",
    "chars": 268,
    "lineNo": 73,
    "ordinal": 34,
    "duty": "always",
    "tier": "never",
    "tierReason": "duty \"always\" but selected by neither tier-0 (3785/4800 chars) nor tier-1 (171/420 chars)",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Working Style",
    "text": "**Delegated agents get the CITE-OR-MARK contract**: every load-bearing claim carries a file path and a line, or is explicitly marked as an inference. A report that mixes verified findings with plausible guesses at the same confidence is not a report, it is a research prompt for whoever reads it next.",
    "chars": 301,
    "lineNo": 75,
    "ordinal": 35,
    "duty": "always",
    "tier": "never",
    "tierReason": "duty \"always\" but selected by neither tier-0 (3785/4800 chars) nor tier-1 (171/420 chars)",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Working Style",
    "text": "**An invoked skill is a GATE, not a suggestion.** Read it before writing the first line, including — especially — when the task looks like a one-liner. The tasks that looked like one-liners are the ones where the skill contained the constraint that made them not one-liners.",
    "chars": 274,
    "lineNo": 77,
    "ordinal": 36,
    "duty": "always",
    "tier": "never",
    "tierReason": "duty \"always\" but selected by neither tier-0 (3785/4800 chars) nor tier-1 (171/420 chars)",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Working Style",
    "text": "**Parallel tool calls**: when several reads are independent, issue them in one block. Serialised reads on a forty-file sweep is the most common way an agent wastes an afternoon, and it is invisible in the transcript because every individual step looks reasonable.",
    "chars": 263,
    "lineNo": 79,
    "ordinal": 37,
    "duty": "conditional",
    "tier": "never",
    "tierReason": "duty \"conditional\" but selected by neither tier-0 (3785/4800 chars) nor tier-1 (171/420 chars)",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Working Style",
    "text": "**Before any rename** that crosses a module boundary, grep for the old name across the whole repo and report the hit count before touching anything. A rename that misses three call sites in a dynamically-typed file is a runtime error discovered by a user rather than a compiler.",
    "chars": 278,
    "lineNo": 81,
    "ordinal": 38,
    "duty": "conditional",
    "tier": "never",
    "tierReason": "duty \"conditional\" but selected by neither tier-0 (3785/4800 chars) nor tier-1 (171/420 chars)",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Working Style",
    "text": "**Tests**: a failing test written first for anything that has ever regressed. Not test-driven development as doctrine — test-driven development for the specific class of bug that already came back once, where the test is the only thing that will notice it coming back a third time.",
    "chars": 281,
    "lineNo": 83,
    "ordinal": 39,
    "duty": "conditional",
    "tier": "onDemand",
    "tierReason": "duty \"conditional\" — retrievable from persona.md, not injected",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Working Style",
    "text": "**Debugging config**: check what the process actually loaded, not what the file says. Roughly half the config bugs here have been a second file winning — a stale local override, an environment variable set in a shell profile, a default baked into a dependency.",
    "chars": 260,
    "lineNo": 85,
    "ordinal": 40,
    "duty": "conditional",
    "tier": "onDemand",
    "tierReason": "duty \"conditional\" — retrievable from persona.md, not injected",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Working Style",
    "text": "**Do not gold-plate.** Finish the task that was asked, then stop. An unrequested refactor in the same diff is a review burden, not a gift; it makes the diff harder to read and it couples a change that was wanted to one that was not discussed.",
    "chars": 242,
    "lineNo": 87,
    "ordinal": 41,
    "duty": "always",
    "tier": "sessionStart",
    "tierReason": "tier-0 preamble — 242 of 242 chars",
    "injectedChars": 242,
    "truncated": false
   },
   {
    "section": "Working Style",
    "text": "**When verifying a data claim**, state the query that was run alongside the result. Three false findings have already been caught that way and a fourth is expected; a number without its query is an assertion, and an assertion cannot be re-run six months later.",
    "chars": 260,
    "lineNo": 89,
    "ordinal": 42,
    "duty": "conditional",
    "tier": "never",
    "tierReason": "duty \"conditional\" but selected by neither tier-0 (3785/4800 chars) nor tier-1 (171/420 chars)",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Working Style",
    "text": "**Expand every acronym** on first use in prose, including the ones used locally every day. These notes get read months later by somebody who has swapped out the surrounding context, and that somebody is usually the person who wrote them.",
    "chars": 237,
    "lineNo": 91,
    "ordinal": 43,
    "duty": "always",
    "tier": "never",
    "tierReason": "duty \"always\" but selected by neither tier-0 (3785/4800 chars) nor tier-1 (171/420 chars)",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Working Style",
    "text": "**Report at the point of no return**, not at the end. A forty-minute run that surfaces its plan at minute thirty-nine cannot be steered, and the whole value of a long-running task is the chance to redirect it while redirecting is still cheap.",
    "chars": 242,
    "lineNo": 93,
    "ordinal": 44,
    "duty": "conditional",
    "tier": "never",
    "tierReason": "duty \"conditional\" but selected by neither tier-0 (3785/4800 chars) nor tier-1 (171/420 chars)",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Standing Instructions",
    "text": "**Never force-push a shared branch.** If history has to change, open a new branch and say why. Rewriting history under somebody else's checkout is not recoverable by them and the time saved by not opening a branch is measured in seconds.",
    "chars": 237,
    "lineNo": 95,
    "ordinal": 45,
    "duty": "always",
    "tier": "sessionStart",
    "tierReason": "tier-0 preamble — 237 of 237 chars",
    "injectedChars": 237,
    "truncated": false
   },
   {
    "section": "Standing Instructions",
    "text": "**Never commit or push unless asked.** Staging is fine and often helpful; the push is a decision that belongs to a human, because it is the first irreversible step and the only one with an audience.",
    "chars": 198,
    "lineNo": 97,
    "ordinal": 46,
    "duty": "always",
    "tier": "never",
    "tierReason": "duty \"always\" but selected by neither tier-0 (3785/4800 chars) nor tier-1 (171/420 chars)",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Standing Instructions",
    "text": "**Secrets**: never read, echo or write `.env`, `*.pem`, key material, or anything under a cloud credentials directory. If a task appears to need one, stop and ask. There is no case where the right move is to open the file and see what is in it.",
    "chars": 244,
    "lineNo": 99,
    "ordinal": 47,
    "duty": "always",
    "tier": "never",
    "tierReason": "duty \"always\" but selected by neither tier-0 (3785/4800 chars) nor tier-1 (171/420 chars)",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Standing Instructions",
    "text": "**Migrations run behind a review gate**: produce the SQL, never execute it. This holds for staging as much as for production, because a staging schema that has drifted from its migration files is a production incident waiting for the next deploy to discover it.",
    "chars": 261,
    "lineNo": 101,
    "ordinal": 48,
    "duty": "conditional",
    "tier": "onDemand",
    "tierReason": "duty \"conditional\" — retrievable from persona.md, not injected",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Standing Instructions",
    "text": "**Default posture on destructive commands** — `rm -rf`, `DROP`, `git reset --hard`, `truncate` — is to print the command and wait, even inside a sandbox. The sandbox is not the point; the habit is, and the habit is what carries over to the machine that is not a sandbox.",
    "chars": 270,
    "lineNo": 103,
    "ordinal": 49,
    "duty": "always",
    "tier": "never",
    "tierReason": "duty \"always\" but selected by neither tier-0 (3785/4800 chars) nor tier-1 (171/420 chars)",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Standing Instructions",
    "text": "**Entity ids are stable slugs, never display names.** A rename must not orphan an edge. This is the rule that the whole store keying depends on, and it has been violated exactly once, which cost a full re-index of every project.",
    "chars": 228,
    "lineNo": 105,
    "ordinal": 50,
    "duty": "conditional",
    "tier": "onDemand",
    "tierReason": "duty \"conditional\" — retrievable from persona.md, not injected",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Standing Instructions",
    "text": "**Technical-review deliverables**: a finding is a file path, a line, a quoted fragment, and a consequence. Anything without all four is an opinion and should be labelled as one. Opinions are welcome; opinions formatted as findings are not.",
    "chars": 239,
    "lineNo": 107,
    "ordinal": 51,
    "duty": "conditional",
    "tier": "never",
    "tierReason": "duty \"conditional\" but selected by neither tier-0 (3785/4800 chars) nor tier-1 (171/420 chars)",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Standing Instructions",
    "text": "**Before porting a pattern** out of another repository, name the repository and the commit it came from. Patterns have been lifted from forks that had already reverted them, and without the provenance there is no way to notice that until it breaks.",
    "chars": 248,
    "lineNo": 109,
    "ordinal": 52,
    "duty": "conditional",
    "tier": "onDemand",
    "tierReason": "duty \"conditional\" — retrievable from persona.md, not injected",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Standing Instructions",
    "text": "**All timestamps written to the store are ISO-8601 UTC.** Local time in a record is a bug, not a preference — the store is read across two working windows and compared against CI logs that are always UTC.",
    "chars": 204,
    "lineNo": 111,
    "ordinal": 53,
    "duty": "always",
    "tier": "never",
    "tierReason": "duty \"always\" but selected by neither tier-0 (3785/4800 chars) nor tier-1 (171/420 chars)",
    "injectedChars": 0,
    "truncated": false
   },
   {
    "section": "Standing Instructions",
    "text": "**When a hook fails, fail loudly.** A hook that swallows its own error produces a system that looks like it is working and is not — this is how most of these stores ended up with an empty vector index, reporting a confident zero percent that nobody had any reason to doubt.",
    "chars": 273,
    "lineNo": 113,
    "ordinal": 54,
    "duty": "always",
    "tier": "sessionStart",
    "tierReason": "tier-0 preamble — 594 of 273 chars",
    "injectedChars": 594,
    "truncated": false
   },
   {
    "section": "Standing Instructions",
    "text": "**Nothing writes to the store outside the writer path.** Hand-inserted rows break the `record_id` prefix convention, and once that convention is broken the auto-versus-awaited write-path split stops meaning anything, which removes the only signal that distinguishes the two failure modes.",

/**
 * Persona bullets are markdown and are overwhelmingly written as `**Label**: body`.
 * Escapes FIRST, then promotes exactly two inline forms — no HTML from the
 * payload can survive this.
 */
function md(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<span class="mono">$1</span>')
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
}

/** Plural without a bare number: always used inside a sentence. */
function plural(count, one, many) { return count === 1 ? one : (many || one + "s"); }

/** A reason string from the payload, finished as a sentence. Contract reasons are
 *  written as fragments; pasting one mid-paragraph without this runs two
 *  sentences together. */
function sentence(s) {
  const t = String(s == null ? "" : s).trim();
  if (!t) return "";
  return /[.!?]$/.test(t) ? t : t + ".";
}

function shortTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return String(iso || "");
  return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}
function shortDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return String(iso || "").slice(0, 10);
  return d.toISOString().slice(0, 10);
}

/** Clamp on a CHARACTER COUNT with a "show all" — never a CSS ellipsis that
 *  hides how much was cut. Audit finding F6. */
const CLAMP = 96;
function clamped(text, key, expanded) {
  const t = String(text || "");
  if (t.length <= CLAMP) return md(t);
  if (expanded) return md(t) + ` <button class="more" type="button" data-collapse="${esc(key)}">show less</button>`;
  return md(t.slice(0, CLAMP).trimEnd()) + "… " +
    `<button class="more" type="button" data-expand="${esc(key)}">show all ${n(t.length)} characters</button>`;
}

/* ── URL config ─────────────────────────────────────────────────────── */
const VIEWS = [
  { id: "health",    label: "Health" },
  { id: "memories",  label: "Your memories" },
  { id: "about-you", label: "What it knows about you" },
  { id: "trace",     label: "Try a prompt" },
];
const VIEW_IDS = VIEWS.map((v) => v.id).concat(["problem"]);

const P = new URLSearchParams(location.search);
const CFG = {
  key:   P.get("key") || "",
  view:  VIEW_IDS.includes(P.get("view")) ? P.get("view") : "health",
  gap:   P.get("gap") || "",
  demo:  P.get("demo") === "1",
  theme: P.get("theme") || "auto",
  q:     P.get("q") || "",
  slug:  P.get("slug") || "",
};
CFG.static = P.get("static") === "1" || CFG.demo;   // demo never opens a channel

const state = {
  snapshot: null,
  persona: null,
  snapshotId: null,
  loading: true,
  fatal: null,          // the whole read failed
  personaError: null,
  records: null,        // RecordsPage for the memories screen
  recordsError: null,
  recordsLoading: false,
  recall: null,
  recallError: null,
  recallLoading: false,
  examples: null,       // real prompts read back out of the store
  memQ: "",
  memSlug: "",
  traceSlug: "",
  hideClutter: false,
  expanded: new Set(),
  noted: new Map(),     // see postEvent() — judgements posted to /api/events this session
  /**
   * Recall samples MEASURED IN THIS SESSION. See renderPerTurn(): the number of
   * memories that reach the assistant per turn is not in the payload and cannot
   * be computed from it, so it is either measured here or reported as unmeasured.
   * Keyed to the snapshot id: a sample taken against a different store state is
   * not a sample of this one.
   */
  samples: [],
};

/* ══════════════════════════════════════════════════════════════════════
   API — one envelope, one branch
   ══════════════════════════════════════════════════════════════════════ */
function url(route, params) {
  const u = new URL(route, location.origin);
  if (CFG.key) u.searchParams.set("key", CFG.key);
  for (const [k, v] of Object.entries(params || {})) {
    if (v !== undefined && v !== null && v !== "") u.searchParams.set(k, v);
  }
  return u.pathname + u.search;
}

async function api(route, params) {
  const target = url(route, params);
  let res;
  try {
    res = await fetch(target, { headers: { accept: "application/json" } });
  } catch (e) {
    throw apiFailure(`Could not reach the API at ${target}.`, String((e && e.message) || e), target);
  }
  let body;
  try {
    body = await res.json();
  } catch (e) {
    throw apiFailure(
      `${target} answered ${res.status} ${res.statusText}, but the body was not JSON.`,
      "The visualiser server may have stopped, or something else is answering on this port.", target);
  }
  if (!body || typeof body !== "object") throw apiFailure(`${target} returned a malformed envelope.`, "", target);
  if (body.ok === false) {
    const err = body.error || {};
    throw apiFailure(`${target} → ${err.code || "error"}`, err.message || "No message supplied.", target, err.code);
  }
  if (body.snapshotId) state.snapshotId = state.snapshotId || body.snapshotId;
  return body.data;
}

function apiFailure(headline, detail, target, code) {
  const e = new Error(headline);
  e.detail = detail; e.target = target; e.code = code || null; e.isApi = true;
  return e;
}

/**
 * Record ONE judgement to `POST /api/events`, which serve.routeEventsPost
 * appends to `~/.memory-tencentdb/view/events.jsonl`. That file is the
 * documented handoff to the agent's next turn: `skills/memory-view/SKILL.md`
 * tells it to read the tail and treat those lines as what the reader looked at
 * and flagged. The reader clicks while the agent's turn is over; this is the
 * only channel back.
 *
 * DELIBERATELY NOT A CLICK TRACKER. Exactly two things are posted, and both are
 * a verdict the reader supplied that the payload cannot compute:
 *
 *   - `duty.dispute` — "your guess about this line is wrong". The duty class is
 *     a heuristic; the dashed chip already says so. This is the chip's other
 *     half — the user's correction, which exists nowhere else.
 *   - `gap.ack` — "I have read this finding". A gap's severity is measured; a
 *     reader deciding it is handled is not, and cannot be re-derived from a
 *     later snapshot that still shows it.
 *
 * Navigation, copies, searches and traces are NOT posted. Every one of them is
 * either recomputable or noise, and burying two judgements under a hundred
 * navigations makes the file unreadable for the agent it exists to inform.
 * Worse, this page renders the reader's private prompts and memory text: an
 * event log is a second copy of that data with a longer life than the session,
 * so nothing posted here carries content — only the identifiers needed to find
 * it in a store the agent can already read.
 *
 * Shape is the server's existing one: whatever object is posted, plus a
 * server-stamped `snapshotId`, `at` and `timestamp`. `kind` plus its target is
 * the client's half of that contract, and it matches the lines already in the
 * file (`{"kind":"gap.ack","gapId":…}`). No second format is invented.
 *
 * Fire-and-forget: a note that fails to save must never break the screen the
 * reader is standing on, and it is never the source of truth — the store is.
 */
async function postEvent(payload) {
  // `?demo=1` is the standalone fixture: there may be no server behind it at all,
  // and its "findings" are synthetic, so a note about one is meaningless. NOT
  // gated on `CFG.static` — `?static=1` reads the live store and only skips the
  // SSE channel, so it must stay pixel-identical to live for the deterministic
  // screenshots it exists to take. Hiding a control there would make the
  // screenshot lie about the page.
  if (CFG.demo) return false;
  try {
    const res = await fetch(url(ROUTES.EVENTS), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(payload),
    });
    return res.ok;
  } catch (_) {
    return false;
  }
}

/**
 * Notes made in THIS session: key -> "saved" | "failed". Only ever a render
 * hint. The append-only log is the record; this Set just stops the page from
 * silently swallowing a click, and tells the truth when the write did not land.
 */
function noteState(key) { return state.noted.get(key) || null; }

/**
 * Parse the inline fixture. There is deliberately no adapter here: `?demo=1`
 * feeds the same objects through the same code paths as the live API, so a
 * payload shape the shell can no longer render fails HERE, visibly, before it
 * fails on somebody's store. `snapshot.persona` is re-attached because the live
 * shell reads the richer PersonaResponse from /api/persona while the Snapshot
 * carries the summary; one copy cannot drift from itself.
 */
function loadFixture() {
  const raw = JSON.parse(document.getElementById("fixture").textContent);
  const snapshot = Object.assign({}, raw.snapshot, { persona: raw.persona });
  return { snapshot, persona: raw.persona, recall: raw.recall, records: raw.records || null };
}

/* ══════════════════════════════════════════════════════════════════════
   The three-way read, rendered three ways.

   contract.js carries `ok` / `unmeasured` / `error` everywhere a reading could
   have failed, because the bug that motivated this whole visualiser was an
   unmeasured reading averaged in as a zero: stores whose vector index had never
   been written reported "0 vectors", which was blended into a coverage
   percentage and raised a false alarm twice. The enum makes that inexpressible
   in the payload — but only if the UI keeps the three apart. Colour is never
   the carrier: a solid dot, a 45° hatch and a filled critical square are three
   different SHAPES, each with its own words beside it.
   ══════════════════════════════════════════════════════════════════════ */
function statusMark(status) {
  if (status === "unmeasured") return '<span class="mk hatch" aria-hidden="true"></span>';
  if (status === "error") return '<span class="mk err" aria-hidden="true"></span>';
  return '<span class="mk" aria-hidden="true"></span>';
}

/* ══════════════════════════════════════════════════════════════════════
   PROBLEMS — one entry per contract.js GAP_KIND.

   Each turns a group of Gaps into: a sentence with the number inside it, one
   line of why it matters, and something to run or somewhere to go. There is no
   slot for a bare figure and no default that prints one; a kind with no entry
   falls back to the tool's own `Gap.title`, which is at least a sentence.
   ══════════════════════════════════════════════════════════════════════ */
const sum = (gaps, f) => gaps.reduce((a, g) => a + (Number(f(g)) || 0), 0);
const CMD_SYNC = "tmem sync";

const PROBLEMS = {
  vectors_missing: {
    impact: (g) => g.evidence.withoutVector,
    build(gs) {
      const records = sum(gs, (g) => g.evidence.withoutVector);
      const empty = gs.filter((g) => g.evidence.vectorState === "empty").length;
      return {
        headline: `${n(gs.length)} ${plural(gs.length, "project")} can only find memories that use your exact words.`,
        why: `${n(records)} ${plural(records, "memory", "memories")} there ${plural(records, "has", "have")} no meaning-index, ` +
             `so asking “how do we handle auth errors” will not find one saved as “401 retry policy”. ` +
             `${n(empty)} of them ${plural(empty, "has", "have")} an index file that exists and is empty — a measured zero, not an unknown.`,
        cmd: CMD_SYNC,
      };
    },
  },
  vectors_orphaned: {
    impact: (g) => g.evidence.orphanVectors,
    build(gs) {
      const v = sum(gs, (g) => g.evidence.orphanVectors);
      return {
        headline: `${n(v)} index ${plural(v, "entry", "entries")} point at a memory that no longer exists.`,
        why: "Harmless to read, but they take up room in the index and make its size disagree with the number of memories.",
        cmd: CMD_SYNC,
      };
    },
  },
  duplicate_records: {
    impact: (g) => g.evidence.exact,
    build(gs) {
      const dupes = sum(gs, (g) => g.evidence.exact);
      return {
        headline: `${n(dupes)} of your memories were saved more than once, word for word.`,
        why: `Across ${n(gs.length)} ${plural(gs.length, "project")}. A sentence stored twice competes with itself for the few lines handed over each turn, ` +
             "so a duplicate can crowd out something you only said once.",
        href: "memories",
        hrefLabel: "See them",
      };
    },
  },
  low_signal_records: {
    impact: (g) => g.evidence.unionRecords,
    build(gs, snap) {
      // `Totals.lowSignal` is the same measurement with a stable shape; the gap's
      // own evidence has carried the per-class counts inline at times and not at
      // others, so the totals are read first and the gap is the fallback.
      const e = gs[0].evidence || {};
      const t = (snap.totals && snap.totals.lowSignal) || {};
      const per = t.perClass || e;
      const union = t.unionRecords != null ? t.unionRecords : e.unionRecords;
      const of = t.records != null ? t.records : (e.records != null ? e.records : e.of);
      const classes = Object.entries(VOCAB.lowSignal)
        .map(([k, w]) => [per[k] || 0, w])
        .filter(([c]) => c > 0)
        .sort((a, b) => b[0] - a[0])
        .slice(0, 3)
        .map(([c, w]) => `${n(c)} ${w}`);
      return {
        headline: `${n(union)} of your ${n(of)} memories are clutter that was saved by mistake.`,
        why: (classes.length ? `Mostly ${classes.join(", ")} — competing` : "They compete") +
             " with the real ones for the few lines handed over each turn.",
        href: "memories",
        hrefLabel: "See what they are",
      };
    },
  },
  scene_invisible: {
    impact: (g) => g.evidence.invisibleInNav,
    build(gs, snap) {
      const t = snap.totals;
      const hidden = typeof t.scenesUnreachableInEveryNav === "number"
        ? t.scenesUnreachableInEveryNav : sum(gs, (g) => g.evidence.invisibleInNav);
      return {
        headline: `${n(hidden)} of your ${n(t.scenes)} topic summaries are in no project's list.`,
        // NOT "never offered this turn". Each project gets its own list and a turn
        // renders exactly one of them, so far more than `hidden` goes unmentioned on
        // any given turn; what `hidden` counts is summaries that fall past the end
        // of their OWN project's list, and so are offered nowhere, ever.
        why: `Every project shows the assistant its own list, capped at ${n(t.navBudgetChars)} characters — about five topics — and these fall past the end of it, in the one project they belong to.`,
        cmd: gs[0].suggestion || null,
      };
    },
  },
  // No `scene_orphaned` / `scene_dangling` entries: both GAP_KINDs were deleted
  // from contract.js because they scored a join (`l1_records.scene_name` ->
  // scene filename) that no writer maintains, so they fired on 218 of 219 scene
  // files and rendered here as a confident, alarming, wrong sentence about the
  // user's data. If a gap kind ever arrives here without an entry, the fallback
  // in buildProblems() shows the tool's own `Gap.title` and says whose words
  // they are — which is the correct behaviour for a finding we cannot phrase.
  scene_stale_hot: {
    impact: (g) => g.evidence.staleHot || 1,
    build(gs) {
      const c = sum(gs, (g) => g.evidence.staleHot || 0);
      return {
        headline: `${n(c)} topic ${plural(c, "summary", "summaries")} ${plural(c, "is", "are")} still marked active but ${plural(c, "has", "have")} not been touched for 90 days.`,
        why: "They are ranked as if they were current, so they take the slots a genuinely active topic would have had.",
        cmd: gs[0].suggestion || null,
      };
    },
  },
  heat_scale_mismatch: {
    impact: () => 1,
    build(gs) {
      const e = gs[0].evidence;
      return {
        headline: `The “how active is this topic” marker never appears on any of your ${n(e.scenes)} topic summaries.`,
        why: `They are written on a ${e.writerScale || `${e.observedMin}–${e.observedMax}`} scale and read on one that starts at ${n(e.readerFirstFlameAt)}, ` +
             "so every topic reads as cold and the assistant has nothing to rank them by.",
        cmd: gs[0].suggestion || null,
      };
    },
  },
  persona_unprojected: {
    impact: (g) => g.evidence.droppedAlwaysDuties,
    build(gs) {
      const e = gs[0].evidence;
      return {
        headline: `${n(e.droppedAlwaysDuties)} of the ${n(e.totalBullets)} things written about you never reach the assistant — and every one of them is marked “always apply”.`,
        why: `${n(e.sessionStart)} arrive at the start of each session and ${n(e.onDemand)} are fetched only if it goes looking. A rule the assistant cannot see is not a rule.`,
        href: "about-you",
        hrefLabel: "Show them",
      };
    },
  },
  persona_missing: {
    impact: () => 1,
    build() {
      return {
        headline: "Your assistant has not built a picture of you yet.",
        why: "It does that after enough conversations. Until then it starts every session knowing nothing about how you work.",
        cmd: "/memory-consolidate",
      };
    },
  },
  capture_backlog: {
    impact: (g) => (g.evidence && (g.evidence.turns || g.evidence.turnsSince)) || 1,
    build(gs) {
      const e = gs[0].evidence || {};
      const t = e.turns || e.turnsSince || 0;
      return {
        headline: `${n(t)} ${plural(t, "conversation turn has", "conversation turns have")} happened since your memories were last tidied up.`,
        why: "New memories are saved flat until they are consolidated into topics; until then they are harder to find and easier to lose.",
        cmd: gs[0].suggestion || "/memory-consolidate",
      };
    },
  },
  config_unreadable: {
    impact: () => 1,
    build(gs) {
      return {
        headline: "Your memory settings file could not be read, so the defaults are in force.",
        why: `The tool said: ${gs[0].title}. Anything you changed in that file is not being applied.`,
        cmd: null,
      };
    },
  },
};

/** severity → the words above a problem row, and its sort weight. */
const SEV = {
  critical: { rank: 3, first: "Fix this first", rest: "Fix soon" },
  warn:     { rank: 2, first: "Worth a look", rest: "Worth a look" },
  info:     { rank: 1, first: "Worth knowing", rest: "Worth knowing" },
};

/**
 * Gaps → problems. Measured gaps only: `unmeasured` ones are not problems, they
 * are the absence of a measurement, and they get their own strip and their own
 * screen. Collapsing the two is the bug this tool was built to catch.
 */
function buildProblems(snap) {
  const gaps = Array.isArray(snap.gaps) ? snap.gaps : [];
  const byKind = new Map();
  for (const g of gaps) {
    if (g.unmeasured) continue;
    if (g.kind === "store_unreadable") continue;   // an error, not a problem — its own state
    if (!byKind.has(g.kind)) byKind.set(g.kind, []);
    byKind.get(g.kind).push(g);
  }
  const out = [];
  for (const [kind, gs] of byKind) {
    const spec = PROBLEMS[kind];
    const sev = gs.some((g) => g.severity === "critical") ? "critical"
      : gs.some((g) => g.severity === "warn") ? "warn" : "info";
    let body;
    if (spec) {
      body = spec.build(gs, snap);
    } else {
      // No entry for this kind. Fall back to the tool's own sentence rather than
      // inventing one — and say whose words they are.
      body = {
        headline: gs[0].title,
        why: "That is the tool's own wording — this finding has no plain-language version yet.",
        cmd: gs[0].suggestion || null,
      };
    }
    const impact = spec && spec.impact ? gs.reduce((a, g) => a + (Number(spec.impact(g)) || 0), 0) : gs.length;
    out.push(Object.assign({ kind, sev, gaps: gs, impact }, body));
  }
  out.sort((a, b) => (SEV[b.sev].rank - SEV[a.sev].rank) || (b.impact - a.impact));
  return out;
}

function unmeasuredGroup(snap) {
  const gs = (snap.gaps || []).filter((g) => g.unmeasured);
  if (!gs.length) return null;
  const records = sum(gs, (g) => (g.evidence && g.evidence.records) || 0);
  const reasons = [...new Set(gs.map((g) => (g.evidence && g.evidence.reason) || "no reason recorded"))];
  return { gaps: gs, stores: gs.length, records, reasons };
}

function erroredStores(snap) {
  return (snap.stores || []).filter((s) => s.status === "error");
}

/* ══════════════════════════════════════════════════════════════════════
   Chrome
   ══════════════════════════════════════════════════════════════════════ */
function renderTabs() {
  const snap = state.snapshot;
  const problems = snap && !state.loading ? buildProblems(snap) : null;
  const counts = {
    health: problems ? problems.filter((p) => p.sev !== "info").length : null,
    memories: snap ? snap.totals.records : null,
  };
  const active = CFG.view === "problem" ? "health" : CFG.view;
  document.getElementById("tabs").innerHTML = VIEWS.map((v) => {
    const c = counts[v.id];
    return `<a href="${esc(url(location.pathname, { view: v.id }))}" data-view="${v.id}"` +
      (v.id === active ? ' aria-current="page"' : "") + `>${esc(v.label)}` +
      (typeof c === "number" ? `<span class="n">${n(c)}</span>` : "") + `</a>`;
  }).join("");
  document.getElementById("rootpath").textContent = snap && snap.rootDir ? snap.rootDir : "reading…";
}

function chan(stateName, text) {
  const c = document.getElementById("chan");
  c.setAttribute("data-state", stateName);
  document.getElementById("chan-text").textContent = text;
}

/**
 * The store changed under the reader. Never re-render silently: the figure they
 * are looking at is the one they were told about.
 */
function showChangedBadge() {
  const slot = document.getElementById("changed-slot");
  if (slot.firstChild) return;
  slot.innerHTML = `<span class="changed-badge" role="status">store changed — refresh
      <button class="btn" id="reload-btn" type="button">Reload</button></span>`;
  document.getElementById("reload-btn").addEventListener("click", () => location.reload());
}

function applyTheme(t) {
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  document.getElementById("theme-toggle").textContent = "Theme: " + t;
  CFG.theme = t;
}

/* ══════════════════════════════════════════════════════════════════════
   Shared blocks
   ══════════════════════════════════════════════════════════════════════ */
function footnote(extra) {
  const snap = state.snapshot;
  const id = (snap && snap.snapshotId) || state.snapshotId;
  const at = snap && snap.generatedAt ? shortTime(snap.generatedAt) : null;
  const bits = [];
  if (at) bits.push(`Read at ${esc(at)}`);
  if (id) bits.push(`reading <span class="id">${esc(id)}</span>`);
  bits.push("nothing on this page changes your memory — it only reads.");
  return `<p class="footnote"><span>${bits.join(" · ")}</span>${extra ? `<span>${extra}</span>` : ""}</p>`;
}

function copyBtn(cmd, primary) {
  return `<button class="btn${primary ? " primary" : ""}" type="button" data-copy="${esc(cmd)}">Copy command</button>`;
}

function actionFor(p, primary) {
  if (p.cmd) return `<code class="cmd">${esc(p.cmd)}</code>${copyBtn(p.cmd, primary)}`;
  if (p.href) return `<a class="btn${primary ? " primary" : ""}" href="${esc(url(location.pathname, { view: p.href }))}" data-view="${esc(p.href)}">${esc(p.hrefLabel || "Show me")}</a>`;
  return `<a class="btn" href="${esc(url(location.pathname, { view: "problem", gap: p.kind }))}" data-view="problem" data-gap="${esc(p.kind)}">What this means</a>`;
}

function problemRow(p, isFirst) {
  const tag = isFirst ? SEV[p.sev].first : SEV[p.sev].rest;
  const detail = url(location.pathname, { view: "problem", gap: p.kind });
  return `<div class="issue" data-sev="${p.sev}">
    <span class="rule"></span>
    <div>
      <span class="sev" data-sev="${p.sev}"><span class="mk"></span>${esc(tag)}</span>
      <h3><a href="${esc(detail)}" data-view="problem" data-gap="${esc(p.kind)}">${esc(p.headline)}</a></h3>
      <p>${esc(p.why)}</p>
    </div>
    <div class="act">${actionFor(p, isFirst)}</div>
  </div>`;
}

/**
 * THE HONESTY SLOT.
 *
 * "About 3 memories reach the assistant each turn" is the counterweight that
 * stops "5 548 memories saved" winning an argument it should lose. It is also
 * NOT IN THE PAYLOAD (design-brief.md § Gaps in the upstream, item 3) and cannot
 * be derived from one: how much reaches the agent depends on the question asked.
 *
 * So it is never asserted unless it was measured:
 *   1. if a future payload carries `totals.recallPerTurn`, use it and say where
 *      it came from;
 *   2. else if the reader has traced real prompts on the Try-a-prompt screen in
 *      this session, report those, labelled as the sample they are;
 *   3. else render the slot as NOT MEASURED, with the hatch mark, and point at
 *      the screen that would measure it.
 *
 * A fabricated counterweight would be this project's own failure mode, committed
 * by the screen built to expose it.
 */
function renderPerTurn(snap) {
  const supplied = snap.totals && snap.totals.recallPerTurn;
  if (supplied && typeof supplied.value === "number") {
    return `<div class="gapline">About <b>${n(supplied.value)} ${plural(supplied.value, "memory", "memories")} reach the assistant</b> each turn` +
      (supplied.reason ? ` — ${esc(supplied.reason)}` : "") + ".</div>";
  }
  const s = state.samples.filter((x) => x.snapshotId === (snap.snapshotId || state.snapshotId));
  if (s.length) {
    const counts = s.map((x) => x.hits);
    const lo = Math.min.apply(null, counts), hi = Math.max.apply(null, counts);
    const spread = lo === hi
      ? `<b>${n(lo)} ${plural(lo, "memory", "memories")} reached the assistant</b>`
      : `<b>between ${n(lo)} and ${n(hi)} memories reached the assistant</b>`;
    return `<div class="gapline">On ${n(s.length)} ${plural(s.length, "prompt")} you traced in this session, ${spread} per turn.
      <a href="${esc(url(location.pathname, { view: "trace" }))}" data-view="trace">Trace another</a> —
      ${s.length === 1 ? "one prompt is a reading, not an average" : "these are your prompts, not an average over every prompt"}.</div>`;
  }
  return `<div class="gapline unmeasured">${statusMark("unmeasured")}<span>How many of them reach the assistant on a given turn is
    <b>not checked yet</b> — it depends on what you ask, so nothing here can compute it.
    <a href="${esc(url(location.pathname, { view: "trace" }))}" data-view="trace">Trace one of your prompts</a> and this
    line reports what actually happened.</span></div>`;
}

function tiles(snap) {
  const t = snap.totals;
  const proj = (state.persona && state.persona.projection) || (snap.persona && snap.persona.projection) || null;
  // The store-wide number and the number a turn actually experiences are different
  // measurements, and the old copy quoted the first as if it were the second ("N
  // never offered to it — the list it sees is capped at 800 characters"), which
  // reads as one 800-char list holding every summary. There is no such list: every
  // project renders its own, and a session renders exactly one. So the sum gets the
  // quantifier that makes it true ("in no project"), and the exact per-block figure
  // — which is what a reader is really asking for — is shown beside it, named,
  // from the largest project whose block WAS measurable.
  const unreachable = t.scenesUnreachableInEveryNav;
  const biggestBlock = (snap.stores || [])
    // `visibleInNav` is null unless the split was measured (contract §4), so this
    // is the same test as `navStatus === "ok"` without depending on a field an
    // older payload may predate.
    .filter((s) => s.scenes && typeof s.scenes.visibleInNav === "number" && s.scenes.count > 0)
    .sort((a, b) => b.scenes.count - a.scenes.count)[0] || null;
  const here = biggestBlock
    ? ` In ${esc(biggestBlock.label)}, your largest, it is shown ${n(biggestBlock.scenes.visibleInNav)} of ${n(biggestBlock.scenes.count)}.`
    : "";
  const sceneGap = t.scenes === 0
    ? "Summaries are written once there is enough to summarise."
    : (typeof unreachable === "number"
      ? (unreachable > 0
        ? `<b>${n(unreachable)} ${plural(unreachable, "is", "are")} in no project's list</b> — each project shows its own, capped at ${n(t.navBudgetChars)} characters.${here}`
        : `<b>All ${n(t.scenes)} are in their own project's list.</b>${here}`)
      : "Whether they reach their project's list was not measured.");
  const personaGap = !proj
    ? "Nothing has been written about you yet."
    : `<b>${n(proj.byTier.sessionStart)} arrive each session</b>; ${n(proj.byTier.never)} never reach it.`;

  return `<div class="tiles">
    <div class="tot">
      <div class="l">Memories saved</div>
      <div class="v">${n(t.records)}</div>
      ${t.records === 0
        ? '<div class="gapline">This is a real zero — the store was read and it is empty.</div>'
        : renderPerTurn(snap)}
    </div>
    <div class="tot">
      <div class="l">Topic summaries</div>
      <div class="v">${n(t.scenes)}</div>
      <div class="gapline">${sceneGap}</div>
    </div>
    <div class="tot">
      <div class="l">Things it knows about you</div>
      <div class="v">${proj ? n(proj.totalBullets) : "0"}</div>
      <div class="gapline">${personaGap}</div>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════════════════════════════
   Screen: Health check
   ══════════════════════════════════════════════════════════════════════ */
function screenHealthLoading() {
  const sk = (cls, w, mt, h) =>
    `<span class="sk ${cls}" style="width:${w};margin-top:${mt || 0}px${h ? `;height:${h}px` : ""}"></span>`;
  const row = `<div class="issue" data-sev="unchecked"><span class="rule"></span><div>
      ${sk("line", "140px")}${sk("title", "60%", 8)}${sk("line", "78%", 9)}${sk("line", "64%", 6)}
    </div><div class="act">${sk("line", "160px", 0, 32)}</div></div>`;
  return `<p class="verdict-sub" style="margin-top:0">Reading your memory folder. The screen and the path are known already; the verdict is not.</p>
    ${sk("big", "620px", 10)}${sk("line", "430px", 12)}
    <div class="issues">${row}${row}${row}</div>
    <div class="tiles">
      <div class="tot"><div class="l">Memories saved</div>${sk("big", "120px", 2)}<div class="gapline">${sk("line", "230px")}</div></div>
      <div class="tot"><div class="l">Topic summaries</div>${sk("big", "90px", 2)}<div class="gapline">${sk("line", "250px")}</div></div>
      <div class="tot"><div class="l">Things it knows about you</div>${sk("big", "80px", 2)}<div class="gapline">${sk("line", "210px")}</div></div>
    </div>
    <p class="footnote"><span>Reading… nothing on this page changes your memory.</span></p>`;
}

function screenHealthEmpty(snap) {
  const t = snap.totals;
  return `<div class="empty">
      <h2>Nothing saved yet — and nothing wrong.</h2>
      <p>Your assistant starts remembering after your first real conversation in a project: what you decided,
      what you rejected, and how you like things done. ${n(t.stores)} ${plural(t.stores, "project is", "projects are")}
      set up under <span class="rootpath">${esc(snap.rootDir)}</span> and there are no memories in ${plural(t.stores, "it", "them")} yet.</p>
      <p>If you want it to start now rather than after the next session, run the set-up once. It creates the two
      small database files and writes nothing else.</p>
      <div class="acts">
        <code class="cmd">/memory-init</code>${copyBtn("/memory-init", true)}
        <a class="btn" href="${esc(url(location.pathname, { view: "trace" }))}" data-view="trace">Or try a prompt anyway</a>
      </div>
    </div>
    ${tiles(snap)}
    ${footnote()}`;
}

function screenHealthErrored(snap, errored) {
  const rows = errored.map((s) => `<div class="issue" data-sev="critical">
      <span class="rule"></span>
      <div>
        <span class="sev" data-sev="critical"><span class="mk err"></span>Could not read</span>
        <h3>${esc(s.label)} — this project's memory file could not be opened.</h3>
        <p>The operating system said: <code class="cmd">${esc(s.reason || "no reason recorded")}</code>.
        Its memories are not counted anywhere on this page — not as zero, not at all.</p>
      </div>
      <div class="act"><span class="tag">${esc(s.slug)}</span></div>
    </div>`).join("");

  return `<h1 class="verdict sm">${n(errored.length)} ${plural(errored.length, "project", "projects")}
      <span class="bad">could not be opened</span>.</h1>
    <p class="verdict-sub">Everything else on this page is measured from the other ${n(snap.totals.readableStores)}.
      The difference is unknown, not zero — ${plural(errored.length, "that project was", "those projects were")} never opened,
      so nobody knows what is in ${plural(errored.length, "it", "them")}.</p>
    <div class="issues">${rows}</div>
    <div class="acts">
      <button class="btn primary" type="button" data-reload="1">Try again</button>
      <span class="tag">${esc(snap.rootDir)}</span>
    </div>
    ${screenHealthMain(snap, { skipVerdict: true })}
    ${footnote()}`;
}

function screenHealthMain(snap, opt) {
  opt = opt || {};
  const problems = buildProblems(snap);
  const attention = problems.filter((p) => p.sev !== "info");
  const smaller = problems.filter((p) => p.sev === "info");
  const um = unmeasuredGroup(snap);
  const top = problems.slice(0, 3);
  const rest = problems.slice(3);

  let head = "";
  if (!opt.skipVerdict) {
    if (!problems.length) {
      head = `<h1 class="verdict">Your memory is <span class="ok">in good shape</span>. Nothing to do.</h1>
        <p class="verdict-sub">All ${n(snap.totals.stores)} projects were read, and nothing measured is out of order.</p>`;
    } else {
      const k = attention.length || problems.length;
      head = `<h1 class="verdict">Your memory is <span class="ok">working</span> — ${n(k)} ${plural(k, "thing needs", "things need")} attention.</h1>
        <p class="verdict-sub">Checked ${n(snap.totals.stores)} ${plural(snap.totals.stores, "project")}${
          snap.totals.records ? `, ${n(snap.totals.records)} memories` : ""}. Nothing has been lost.
          ${top[0] && top[0].cmd ? "The first fix is one command." : "The first one is worth reading."}</p>`;
    }
  } else {
    head = `<h2 class="h2" style="margin-top:26px">What was measurable, on the ${n(snap.totals.readableStores)} that opened</h2>`;
  }

  const list = !problems.length
    ? `<div class="issues"><div class="issue" data-sev="ok">
        <span class="rule"></span>
        <div>
          <span class="sev" data-sev="ok"><span class="mk"></span>Checked and fine</span>
          <h3>All ${n(snap.totals.stores)} projects were read and nothing is out of order.</h3>
          <p>Every measurement this tool takes came back clean. The figures below are what it found.</p>
        </div>
        <div class="act"><a class="btn" href="${esc(url(location.pathname, { view: "trace" }))}" data-view="trace">Try a prompt</a></div>
      </div></div>`
    : `<div class="issues">${top.map((p, i) => problemRow(p, i === 0 && !opt.skipVerdict)).join("")}</div>` +
      (rest.length ? `<details class="card" style="padding:10px 18px">
          <summary style="cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center">Show the other ${n(rest.length)} ${plural(rest.length, "finding")}
            <span style="font-weight:400;color:var(--c-secondary)">&nbsp;— ${n(Math.max(0, attention.length - 3))} worth acting on, ${n(smaller.length)} worth knowing</span></summary>
          <div class="issues" style="margin-top:10px">${rest.map((p) => problemRow(p, false)).join("")}</div>
        </details>` : "");

  const strip = um ? `<div class="strip">
      <span class="rule"></span>
      <div>
        <h3><span class="sev" data-sev="unchecked" style="margin:0 8px 0 0"><span class="mk"></span>Not checked yet</span>${
          n(um.stores)} ${plural(um.stores, "project has", "projects have")} never been checked — which is not the same as scoring zero.</h3>
        <p>No index was ever built there, so ${plural(um.stores, "its", "their")} ${n(um.records)} memories are left out of the
        figures above rather than counted as failures in them.</p>
      </div>
      <a class="btn" href="${esc(url(location.pathname, { view: "problem", gap: "unchecked" }))}" data-view="problem" data-gap="unchecked">Which ${plural(um.stores, "project", "projects")}</a>
    </div>` : "";

  return head + list + strip + tiles(snap) + (opt.skipVerdict ? "" : footnote());
}

function screenHealth() {
  if (state.loading) return screenHealthLoading();
  if (state.fatal) return screenFatal(state.fatal);
  const snap = state.snapshot;
  const errored = erroredStores(snap);
  if (errored.length) return screenHealthErrored(snap, errored);
  if (!snap.totals.records) return screenHealthEmpty(snap);
  return screenHealthMain(snap);
}

/* ══════════════════════════════════════════════════════════════════════
   Screen: Problem detail
   ══════════════════════════════════════════════════════════════════════ */
function backToHealth() {
  return `<p style="margin:0 0 12px"><a class="btn" href="${esc(url(location.pathname, { view: "health" }))}" data-view="health">← Back to health</a></p>`;
}

function screenProblemUnchecked(snap) {
  const um = unmeasuredGroup(snap);
  if (!um) return backToHealth() + screenNotFound("Nothing is unchecked — every project has been measured.");
  const byRecords = um.gaps.slice().sort((a, b) =>
    ((b.evidence && b.evidence.records) || 0) - ((a.evidence && a.evidence.records) || 0));
  const rows = byRecords.map((g) => {
    const recs = (g.evidence && g.evidence.records) || 0;
    return `<div class="row">
      <div>
        <div class="txt"><b>${esc((g.subject && g.subject.label) || g.id)}</b></div>
        <div class="meta">${esc((g.evidence && g.evidence.slug) || "")}</div>
      </div>
      <div class="side">
        <span class="tag" data-t="unchecked">${statusMark("unmeasured")}not checked</span>
        <span class="tag">${n(recs)} ${plural(recs, "memory", "memories")}</span>
      </div>
    </div>`;
  }).join("");

  return backToHealth() +
    `<h1 class="verdict sm">${n(um.stores)} ${plural(um.stores, "project has", "projects have")} never been checked.</h1>
    <p class="verdict-sub">Nothing here is known to be wrong — or right. Those are different things, so this page refuses to score them.</p>
    <div class="note hatched">
      <span class="glyph" aria-hidden="true">⧅</span>
      <span><b>Not checked is not zero.</b> These ${n(um.stores)} projects have no index file at all, so their
      ${n(um.records)} memories were left out of the figures on the health screen rather than counted as failures in them.
      Averaging them in as zeros would have made those figures read worse than the truth — which is exactly the mistake
      this tool was built after.</span>
    </div>
    <div class="card">
      <h2 class="h2">The ${n(um.stores)}, and how much is in each</h2>
      <div class="rows" style="margin-top:10px">${rows}</div>
    </div>
    <div class="card">
      <h2 class="h2">If you want them checked</h2>
      <p class="lede">The same command builds an index in each one. After that they get a real reading — “fine” or
      “nothing indexed”. Either answer beats the current silence.</p>
      <div class="acts">
        <code class="cmd">${esc(CMD_SYNC)}</code>${copyBtn(CMD_SYNC, true)}
        <span class="tag">${n(um.records)} ${plural(um.records, "memory", "memories")}</span>
      </div>
    </div>
    ${footnote(`<span>Reason recorded for all ${n(um.stores)}: “${esc(um.reasons[0])}”.</span>`)}`;
}

function screenProblem() {
  if (state.loading) return screenHealthLoading();
  if (state.fatal) return screenFatal(state.fatal);
  const snap = state.snapshot;
  if (CFG.gap === "unchecked") return screenProblemUnchecked(snap);

  const p = buildProblems(snap).find((x) => x.kind === CFG.gap);
  if (!p) return backToHealth() + screenNotFound("That finding is not in the current reading — it may have been fixed, or the reading may have moved on.");

  const spec = PROBLEMS[p.kind];
  const scoped = p.gaps.filter((g) => g.subject && g.subject.scope === "project");
  const impactOf = (g) => (spec && spec.impact ? Number(spec.impact(g)) || 0 : 0);
  const worst = scoped.slice().sort((a, b) => impactOf(b) - impactOf(a)).slice(0, 3);

  const kv = [];
  if (scoped.length) {
    kv.push([`${plural(scoped.length, "Project", "Projects")} affected`,
      `<b>${n(scoped.length)}</b> of ${n(snap.totals.stores)} — ${n(p.impact)} in total between them`]);
    if (worst.length && spec && spec.impact) {
      kv.push(["Worst affected", worst.map((g) => {
        const ev = g.evidence || {};
        const denom = ev.records != null ? ` of ${n(ev.records)}` : "";
        return `${esc(g.subject.label)} — ${n(impactOf(g))}${denom}`;
      }).join(" · ")]);
    }
  } else {
    kv.push(["Where it applies", "Everything under this memory folder, not one project"]);
  }
  if (p.kind === "vectors_missing" && snap.totals.missingByMonth) {
    const months = Object.entries(snap.totals.missingByMonth).sort();
    if (months.length) kv.push(["When they piled up", months.map(([m, c]) => `${n(c)} in ${esc(m)}`).join(", ")]);
  }
  kv.push(["What fixes it", p.cmd
    ? `<code class="cmd">${esc(p.cmd)}</code>${copyBtn(p.cmd, true)}`
    : (p.href
      ? `No single command — it is a judgement call. <a class="btn primary" href="${esc(url(location.pathname, { view: p.href }))}" data-view="${esc(p.href)}">${esc(p.hrefLabel || "Look at it")}</a>`
      : "No command yet. This one is reported so you know about it, not because there is a switch to flip.")]);

  const measured = p.gaps.slice(0, 4).map((g) =>
    `${g.kind} · ${g.severity} · ${g.title}\n  ${JSON.stringify(g.evidence)}${g.suggestion ? `\n  → ${g.suggestion}` : ""}`).join("\n\n");

  // "I have read this and it is handled" is a judgement, not a measurement: the
  // next snapshot will still report the gap, because the tool cannot tell a
  // fixed-and-not-yet-resynced store from an ignored one. Posted to
  // events.jsonl so the agent has the reader's verdict on its next turn.
  // Secondary, never `.primary` — the command that actually fixes it keeps the
  // screen's one primary action.
  const ackKey = `gap:${p.kind}`;
  const ackNote = noteState(ackKey);
  const ack = CFG.demo ? "" : `<div class="card">
      <h2 class="h2">Tell your assistant you have seen this</h2>
      <p class="lede">Your assistant cannot see this page. Noting it here passes your verdict to its next turn, so it
      stops raising a finding you have already judged. It changes nothing about your memory, and the next reading
      will still measure this — a note is your opinion, not a fix.</p>
      <div class="acts">${
        ackNote === "saved"
          ? `<span class="tag">Noted — your assistant will see it next turn ✓</span>`
          : ackNote === "failed"
            ? `<span class="tag">That note could not be saved. Nothing else is affected — say it in the terminal instead.</span>`
            : `<button class="btn" type="button" data-ack="${esc(p.kind)}">I have read this one</button>`
      }</div>
    </div>`;

  return backToHealth() +
    `<h1 class="verdict sm">${esc(p.headline)}</h1>
    <p class="verdict-sub">${esc(p.why)}</p>
    <div class="card">
      <h2 class="h2">Where it applies</h2>
      <dl class="kv">${kv.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>
    </div>
    <div class="card">
      <h2 class="h2">What the tool measured</h2>
      <p class="lede">The tool's own words, verbatim — quote this in a bug report.${
